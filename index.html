<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>受注管理表</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* layout: 上部に合計サマリーのタイル、中央に複合グラフ（棒=件数・線=金額）、下に月次テーブル */
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --ink: #1c1b1a;
  --sub: #6b6560;
  --line: #e5e1d8;
  --amazon: #1d4ed8;
  --amazon-soft: #c7d7fb;
  --mercari: #d13a3a;
  --mercari-soft: #f7cfcf;
  --accent-ink: #0f172a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15140f;
    --surface: #1f1d17;
    --ink: #f1efe9;
    --sub: #a89f91;
    --line: #35322a;
    --amazon: #6d9bff;
    --amazon-soft: #253766;
    --mercari: #ff8080;
    --mercari-soft: #5a2222;
    --accent-ink: #f1efe9;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15140f;
  --surface: #1f1d17;
  --ink: #f1efe9;
  --sub: #a89f91;
  --line: #35322a;
  --amazon: #6d9bff;
  --amazon-soft: #253766;
  --mercari: #ff8080;
  --mercari-soft: #5a2222;
  --accent-ink: #f1efe9;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  margin: 0;
  padding-inline: 20px;
  padding-block: 28px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

.login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.login-box {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 32px 28px;
  width: 100%;
  max-width: 340px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.login-box h1 { font-size: 1.2rem; margin: 0; }
.login-box label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.82rem;
  color: var(--sub);
}
.login-box input {
  font-family: inherit;
  font-size: 0.95rem;
  padding: 9px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
}
.login-box button {
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: var(--accent-ink);
  color: var(--bg);
  cursor: pointer;
  margin-top: 6px;
}
.login-error { color: var(--mercari); font-size: 0.82rem; margin: 0; }

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
}
.header-title-group {
  display: flex;
  align-items: baseline;
  gap: 16px;
  flex-wrap: wrap;
}
.logout-button {
  font-family: inherit;
  font-size: 0.8rem;
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--sub);
  cursor: pointer;
  flex-shrink: 0;
}

.filter-row {
  display: flex;
  align-items: flex-end;
  gap: 18px;
  flex-wrap: wrap;
}
.filter-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.78rem;
  color: var(--sub);
}
.filter-label { white-space: nowrap; }
.filter-field select,
.filter-field input[type="date"] {
  font-family: inherit;
  font-size: 0.85rem;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}
.custom-range { flex-direction: row; align-items: center; gap: 6px; }
.custom-range span { color: var(--sub); }
.multi-select {
  position: relative;
  display: inline-block;
}
.multi-select-trigger {
  font-family: inherit;
  font-size: 0.85rem;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  min-width: 140px;
  text-align: left;
}
.multi-select-trigger::after { content: " ▾"; color: var(--sub); }
.multi-select-panel {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  z-index: 10;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 8px 24px color-mix(in srgb, var(--ink) 18%, transparent);
  padding: 8px;
  min-width: 160px;
  white-space: nowrap;
}
.multi-select-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
}
.multi-select-item:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }

header h1 {
  font-size: 1.5rem;
  font-weight: 700;
  margin: 0 0 4px;
  text-wrap: balance;
}
header p { margin: 0; color: var(--sub); font-size: 0.9rem; }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
}
.panel h2 {
  font-size: 1rem;
  margin: 0 0 4px;
}
.detail-button {
  font-family: inherit;
  font-size: 0.8rem;
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}
.detail-button:hover { background: color-mix(in srgb, var(--accent-ink) 10%, transparent); }
#orderListMoreButton { display: block; margin: 14px auto 0; }
#monthSelect {
  font-family: inherit;
  font-size: 0.85rem;
  font-variant-numeric: tabular-nums;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
}
.row-cancelled { opacity: 0.45; }
.status-select {
  font-family: inherit;
  font-size: 0.78rem;
  padding: 4px 6px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
}

.row-clickable { cursor: pointer; }
.row-clickable:hover { background: color-mix(in srgb, var(--accent-ink) 7%, transparent); }
.row-clickable .status-select { cursor: auto; }

.modal-product-title {
  margin: 0 0 12px;
  font-size: 1rem;
  font-weight: 700;
  word-break: break-word;
}

.modal-product-image {
  display: block;
  max-width: 100%;
  max-height: 40vh;
  margin: 0 auto 16px;
  border-radius: 8px;
  min-height: 80px;
  color: var(--sub);
  font-size: 0.85rem;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: color-mix(in srgb, black 45%, transparent);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
}
.modal-box {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  max-width: 480px;
  width: 100%;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 16px 40px color-mix(in srgb, var(--ink) 25%, transparent);
}
.modal-box-wide { max-width: 760px; }
.modal-scroll {
  padding: 24px 24px 20px;
  overflow-y: auto;
}
.modal-close {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: none;
  background: var(--surface);
  color: var(--sub);
  font-size: 1.1rem;
  cursor: pointer;
  z-index: 1;
}
.modal-close:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
#modalContent { margin: 0; }
#modalContent dt {
  font-size: 0.78rem;
  color: var(--sub);
  margin-top: 14px;
}
#modalContent dt:first-child { margin-top: 0; }
#modalContent dd {
  margin: 2px 0 0;
  font-size: 0.95rem;
  word-break: break-all;
}
.row-purchased td:not(.cell-flag) { color: var(--sub); }

.panel .caption { font-size: 0.82rem; color: var(--sub); margin: 0 0 14px; }

.legend {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  font-size: 0.82rem;
  color: var(--sub);
  margin-top: 10px;
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 14px; height: 14px; border-radius: 3px; }
.swatch.bar-amazon { background: var(--amazon-soft); }
.swatch.bar-mercari { background: var(--mercari-soft); }
.swatch.line-amazon { background: none; border-top: 3px solid var(--amazon); height: 0; width: 16px; }
.swatch.line-mercari { background: none; border-top: 3px solid var(--mercari); height: 0; width: 16px; }

.chart-shell { position: relative; height: 360px; }

table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
.cell-wrap { text-align: left; white-space: normal; word-break: break-word; max-width: 220px; }
.sub-line { color: var(--sub); font-size: 0.78rem; }
thead th { color: var(--sub); font-weight: 600; font-size: 0.78rem; }
tbody tr:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.table-wrap { overflow-x: auto; }
.order-table { min-width: 560px; }
.order-table thead th { text-align: center; }
.site-amazon { color: var(--amazon); font-weight: 600; }
.site-mercari { color: var(--mercari); font-weight: 600; }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <form class="login-box" id="loginForm">
    <h1>ログイン</h1>
    <p class="caption">登録済みのメールアドレスでログインしてください。</p>
    <label>
      メールアドレス
      <input type="email" name="email" id="loginEmail" autocomplete="username" required>
    </label>
    <label>
      パスワード
      <input type="password" name="password" id="loginPassword" autocomplete="current-password" required>
    </label>
    <button type="submit" id="loginSubmit">ログイン</button>
    <p class="login-error" id="loginError" hidden></p>
  </form>
</div>

<div class="wrap" id="dashboardScreen" hidden>
  <header>
    <div class="header-top">
      <div class="header-title-group">
        <h1>受注管理表</h1>
        <p class="caption" id="lastUpdated"></p>
      </div>
      <button type="button" class="logout-button" id="logoutButton">ログアウト</button>
    </div>
  </header>
  <p class="caption" id="loadingNotice">データを読み込み中...</p>

  <section class="panel" id="filterPanel">
    <div class="filter-row">
      <label class="filter-field">
        <span class="filter-label">期間</span>
        <select id="periodSelect">
          <option value="week">週</option>
          <option value="month" selected>月</option>
          <option value="half_year">半年</option>
          <option value="year">1年</option>
          <option value="all">全て</option>
          <option value="h1">上半期</option>
          <option value="h2">下半期</option>
          <option value="custom">範囲指定</option>
        </select>
      </label>
      <span class="filter-field custom-range" id="customRangeFields" hidden>
        <input type="date" id="customRangeStart">
        <span>〜</span>
        <input type="date" id="customRangeEnd">
      </span>
      <label class="filter-field">
        <span class="filter-label">状況</span>
        <select id="statusFilterSelect">
          <option value="all">全て</option>
          <option value="before_purchase">仕入前</option>
          <option value="before_shipping" selected>発送前</option>
          <option value="shipped">発送済み</option>
          <option value="cancelled">キャンセル済み</option>
        </select>
      </label>
      <div class="filter-field">
        <span class="filter-label">仕入先</span>
        <div class="multi-select" id="supplierDropdown">
          <button type="button" class="multi-select-trigger" id="supplierTrigger">自社、取引先、その他</button>
          <div class="multi-select-panel" id="supplierPanel" hidden>
            <label class="multi-select-item"><input type="checkbox" value="自社" checked> 自社</label>
            <label class="multi-select-item"><input type="checkbox" value="取引先" checked> 取引先</label>
            <label class="multi-select-item"><input type="checkbox" value="その他" checked> その他</label>
          </div>
        </div>
      </div>
      <div class="filter-field">
        <span class="filter-label">表示タイプ</span>
        <div class="multi-select" id="displayTypeDropdown">
          <button type="button" class="multi-select-trigger" id="displayTypeTrigger">注文リスト</button>
          <div class="multi-select-panel" id="displayTypePanel" hidden>
            <label class="multi-select-item"><input type="checkbox" value="list" checked> 注文リスト</label>
            <label class="multi-select-item"><input type="checkbox" value="graph"> 注文グラフ</label>
          </div>
        </div>
      </div>
      <button type="button" class="detail-button" id="resetFilterButton">リセット</button>
    </div>
  </section>

  <section class="panel">
    <h2>月次データ</h2>
    <p class="caption" id="monthSummaryCaption"></p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th></th>
            <th>件数</th>
            <th>卸値</th>
            <th>売上</th>
            <th>送料</th>
            <th>利益</th>
          </tr>
        </thead>
        <tbody id="monthSummaryBody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel" id="orderListPanel">
    <h2>注文リスト</h2>
    <p class="caption" id="orderListCaption"></p>
    <div class="table-wrap">
      <table class="order-table">
        <thead>
          <tr>
            <th>状況</th>
            <th>注文日時/発送日時</th>
            <th>商品名/JAN</th>
            <th>仕入先/数量</th>
            <th>送料/手数料</th>
          </tr>
        </thead>
        <tbody id="orderListBody"></tbody>
      </table>
    </div>
    <button type="button" class="detail-button" id="orderListMoreButton" hidden>さらに表示</button>
  </section>

  <section class="panel" id="orderGraphPanel" hidden>
    <h2>注文グラフ</h2>
    <p class="caption">棒グラフ(積み上げ)=金額（左軸）、折れ線(スムージング)=件数（右軸）</p>
    <div class="chart-shell">
      <canvas id="chart"></canvas>
    </div>
    <div class="legend">
      <span><i class="swatch bar-amazon"></i>Site_A 金額</span>
      <span><i class="swatch bar-mercari"></i>Site_M 金額</span>
      <span><i class="swatch line-amazon"></i>Site_A 件数</span>
      <span><i class="swatch line-mercari"></i>Site_M 件数</span>
    </div>
  </section>
</div>

<div class="modal-overlay" id="detailModal" hidden>
  <div class="modal-box">
    <button type="button" class="modal-close" id="modalClose" aria-label="閉じる">×</button>
    <div class="modal-scroll">
      <h3 id="modalTitle" class="modal-product-title"></h3>
      <img id="modalImage" class="modal-product-image" alt="商品画像" hidden>
      <dl id="modalContent"></dl>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
// ログイン後にSupabaseの「注文履歴_表示用」ビューから取得したデータを
// ここに入れる（以前はPythonが集計してこのファイルに直接埋め込んでいたが、
// ログインしていない人にもデータが見えてしまうため、埋め込み方式を廃止した）
let DATA = null;
// サイト別・月別の注文明細一覧（キー=YYYY-MM）。卸値はstockdbとJANで紐付け済み
let ORDER_LIST = null;

// 注文状況の更新（update_order_statusというRPC関数しか呼べない権限のanonキー）
const SUPABASE_URL = "https://ragdqeiuiphlhvathrqb.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhZ2RxZWl1aXBobGh2YXRocnFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc1MTE0MzIsImV4cCI6MjA4MzA4NzQzMn0.1X_JNzJspVQ5K6SLpRWxsLLX1NVFeizHX97fSaWo8Bk";

function formatYen(n) {
  return "¥" + Math.round(n).toLocaleString("ja-JP");
}
function formatMonthLabel(ym) {
  const [y, m] = ym.split("-");
  return `${y}/${m}`;
}

function showDetailModal(o) {
  document.getElementById("modalTitle").textContent = o["商品名"] ?? "";

  const img = document.getElementById("modalImage");
  if (o["画像"]) {
    // 画像ファイルが実際には無い場合（JANはあるが画像未登録等）に備えて
    // 読み込み失敗時は非表示にする
    img.onerror = () => {
      img.hidden = true;
    };
    img.alt = "商品画像";
    img.src = o["画像"];
    img.hidden = false;
  } else {
    img.onerror = null;
    img.removeAttribute("src");
    img.hidden = true;
  }

  // 状況は表示のみ（このポップアップ上からは変更できない。変更は一覧のプルダウンから行う）
  document.getElementById("modalContent").innerHTML = `
    <dt>状況</dt><dd>${o["注文状況"] || "受注のみ"}</dd>
    <dt>サイト名</dt><dd>${siteLabel(o["サイト名"])}</dd>
    <dt>注文番号</dt><dd>${o["注文番号"]}</dd>
    <dt>SKU</dt><dd>${o["SKU"] ?? ""}</dd>
    <dt>数量</dt><dd>${o["数量"] ?? ""}</dd>
    <dt>販売価格</dt><dd>${formatYen(o["販売価格"])}</dd>
    <dt>卸値</dt><dd>${o["卸値"] != null ? formatYen(o["卸値"]) : "-"}</dd>
    <dt>配送サイズ</dt><dd>${o["配送サイズ"] ?? "-"}</dd>
    <dt>送料</dt><dd>${o["配送料金"] != null ? formatYen(o["配送料金"]) : "-"}</dd>
    <dt>手数料</dt><dd>${formatYen((o["販売価格"] || 0) * 0.15)}</dd>
    <dt>利益</dt><dd>${o["利益"] != null ? formatYen(o["利益"]) : "-"}</dd>
    <dt>注文日時</dt><dd>${formatDateTime(o["注文日時"])}</dd>
    <dt>発送日時</dt><dd>${formatDateTime(o["出荷日時"])}</dd>
  `;
  document.getElementById("detailModal").hidden = false;
}

function findOrderByUid(id) {
  for (const months of Object.values(ORDER_LIST)) {
    const target = months.find((o) => o["一意キー"] === id);
    if (target) return target;
  }
  return null;
}

function wireTruncateClicks() {
  document.getElementById("orderListBody").addEventListener("click", (e) => {
    // 状況プルダウンのクリックはポップアップを開かない
    if (e.target.closest(".status-select")) return;
    const row = e.target.closest(".row-clickable");
    if (!row) return;
    const o = findOrderByUid(Number(row.dataset.id));
    if (o) showDetailModal(o);
  });
  document.getElementById("modalClose").addEventListener("click", () => {
    document.getElementById("detailModal").hidden = true;
  });
  document.getElementById("detailModal").addEventListener("click", (e) => {
    if (e.target.id === "detailModal") {
      document.getElementById("detailModal").hidden = true;
    }
  });

  document.getElementById("orderListMoreButton").addEventListener("click", () => {
    orderListVisibleCount += ORDER_LIST_PAGE_SIZE;
    renderOrderListBody();
  });
}

// 先頭n文字まで表示し、それを超える場合は末尾を省略記号にする
function truncate(s, n) {
  if (!s) return "";
  return s.length > n ? s.slice(0, n) + "…" : s;
}

function formatDateTime(isoStr) {
  if (!isoStr) return "-";
  const d = new Date(isoStr + "+09:00");
  return d.toLocaleString("ja-JP", {
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit",
  });
}


// 状況は5段階（1/5〜5/5）＋キャンセル済み。数字が大きいほど完了に近い
const STATUS_OPTIONS = ["受注のみ", "取り置き依頼済み", "仕入済み", "受渡し前", "受渡し済み", "キャンセル済み"];
const STATUS_STAGE = { "受注のみ": 1, "取り置き依頼済み": 2, "仕入済み": 3, "受渡し前": 4, "受渡し済み": 5 };
function statusStage(status) {
  return STATUS_STAGE[status] || 1;
}

// 「受渡し済み」(5/5、対応完了)・「キャンセル済み」以外を優先して上に、
// その中では注文日時が新しい順になるよう並べる
function orderListSortKey(status) {
  return (statusStage(status) < 5 && status !== "キャンセル済み") ? 0 : 1;
}
function sortOrderRows(list) {
  return list.slice().sort((a, b) => {
    const pa = orderListSortKey(a["注文状況"]);
    const pb = orderListSortKey(b["注文状況"]);
    if (pa !== pb) return pa - pb;
    return (b["注文日時"] || "").localeCompare(a["注文日時"] || "");
  });
}

let currentOrderLabel = "";

// YYYY-MM-DD文字列に変換する
function toDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
// "YYYY-MM-DD"文字列をローカルのDateに変換する（new Date(文字列)はUTC扱いになりずれるため使わない）
function parseDateStr(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
// JSTでの「今日」をDateで得る（閲覧者のローカル時刻には依存させない）
function getTodayJST() {
  const fmt = new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit" });
  const parts = fmt.formatToParts(new Date());
  const y = Number(parts.find((p) => p.type === "year").value);
  const m = Number(parts.find((p) => p.type === "month").value);
  const d = Number(parts.find((p) => p.type === "day").value);
  return new Date(y, m - 1, d);
}

// 「表示する範囲」の各プリセットボタンに対応する日付範囲（両端含む）と、
// グラフを月単位/日単位どちらで分けるかを返す
function computeRangeForPreset(key) {
  const today = getTodayJST();
  const y = today.getFullYear();
  if (key === "all") {
    if (!DATA.months.length) return null;
    const [fy, fm] = DATA.months[0].split("-").map(Number);
    const [ly, lm] = DATA.months[DATA.months.length - 1].split("-").map(Number);
    return { start: toDateStr(new Date(fy, fm - 1, 1)), end: toDateStr(new Date(ly, lm, 0)), granularity: "month" };
  }
  if (key === "year") {
    return { start: toDateStr(new Date(y, 0, 1)), end: toDateStr(new Date(y, 11, 31)), granularity: "month" };
  }
  if (key === "h1") {
    return { start: toDateStr(new Date(y, 0, 1)), end: toDateStr(new Date(y, 5, 30)), granularity: "month" };
  }
  if (key === "h2") {
    return { start: toDateStr(new Date(y, 6, 1)), end: toDateStr(new Date(y, 11, 31)), granularity: "month" };
  }
  if (key === "half_year") {
    const start = new Date(today);
    start.setMonth(start.getMonth() - 6);
    return { start: toDateStr(start), end: toDateStr(today), granularity: "month" };
  }
  if (key === "month") {
    return {
      start: toDateStr(new Date(y, today.getMonth(), 1)),
      end: toDateStr(new Date(y, today.getMonth() + 1, 0)),
      granularity: "day",
    };
  }
  if (key === "week") {
    const dow = (today.getDay() + 6) % 7; // 0=月曜 ... 6=日曜
    const monday = new Date(today);
    monday.setDate(monday.getDate() - dow);
    const sunday = new Date(monday);
    sunday.setDate(sunday.getDate() + 6);
    return { start: toDateStr(monday), end: toDateStr(sunday), granularity: "day" };
  }
  if (key === "custom") {
    if (!customRangeStart || !customRangeEnd || customRangeStart > customRangeEnd) return null;
    const days = Math.round((parseDateStr(customRangeEnd) - parseDateStr(customRangeStart)) / 86400000) + 1;
    return { start: customRangeStart, end: customRangeEnd, granularity: days <= 35 ? "day" : "month" };
  }
  return null;
}

// 日付範囲を月ごとのバーに分割する（範囲の最初/最後は月の途中で切れることもある）
function monthBarsForRange(startStr, endStr) {
  const start = parseDateStr(startStr), end = parseDateStr(endStr);
  const items = [];
  let y = start.getFullYear(), m = start.getMonth();
  while (y < end.getFullYear() || (y === end.getFullYear() && m <= end.getMonth())) {
    const monthFirst = new Date(y, m, 1);
    const monthLast = new Date(y, m + 1, 0);
    const rangeStart = monthFirst < start ? start : monthFirst;
    const rangeEnd = monthLast > end ? end : monthLast;
    items.push({
      label: `${y}/${String(m + 1).padStart(2, "0")}`,
      start: toDateStr(rangeStart),
      end: toDateStr(rangeEnd),
    });
    m++;
    if (m > 11) { m = 0; y++; }
  }
  return items;
}

// 日付範囲を1日ごとのバーに分割する
function dayBarsForRange(startStr, endStr) {
  const start = parseDateStr(startStr), end = parseDateStr(endStr);
  const items = [];
  const cursor = new Date(start);
  while (cursor <= end) {
    items.push({ label: `${cursor.getMonth() + 1}/${cursor.getDate()}`, start: toDateStr(cursor), end: toDateStr(cursor) });
    cursor.setDate(cursor.getDate() + 1);
  }
  return items;
}

// 現在選択中の期間から、グラフ用のバー項目一覧を作る
function getDisplayItems() {
  const range = computeRangeForPreset(filterPeriodKey);
  if (!range) return [];
  return range.granularity === "day" ? dayBarsForRange(range.start, range.end) : monthBarsForRange(range.start, range.end);
}

// 指定した日付範囲（YYYY-MM-DD、両端含む）に注文日時が入る注文明細を集める
function ordersInRange(start, end) {
  const result = [];
  for (const ym in ORDER_LIST) {
    for (const o of ORDER_LIST[ym]) {
      const d = (o["注文日時"] || "").slice(0, 10);
      if (d && d >= start && d <= end) result.push(o);
    }
  }
  return result;
}

// ====== フィルター状態（期間・状況・仕入先・表示タイプ） ======
let filterPeriodKey = "month";
let filterStatusKey = "before_shipping";
let filterSuppliers = new Set(["自社", "取引先", "その他"]);
let customRangeStart = "";
let customRangeEnd = "";

// 状況フィルター（全て/仕入前/発送前/発送済み/キャンセル済み）に、
// 注文の状況(1〜5/5、またはキャンセル済み)が合うか判定する
function statusMatchesFilter(status) {
  if (filterStatusKey === "all") return true;
  if (filterStatusKey === "cancelled") return status === "キャンセル済み";
  if (status === "キャンセル済み") return false; // キャンセル済みは仕入前/発送前/発送済みには含めない
  const stage = statusStage(status);
  if (filterStatusKey === "before_purchase") return stage <= 2;
  if (filterStatusKey === "before_shipping") return stage <= 4;
  if (filterStatusKey === "shipped") return stage === 5;
  return true;
}

// 状況フィルター・仕入先フィルターを注文明細配列に適用する
function applyFilters(orders) {
  return orders.filter(
    (o) => statusMatchesFilter(o["注文状況"] || "受注のみ") && filterSuppliers.has(supplierLabel(o["SKU"]))
  );
}

// 注文明細配列から、サイト別の件数・金額を集計する
function siteTotals(orders) {
  let c1 = 0, p1 = 0, c2 = 0, p2 = 0;
  for (const o of orders) {
    if (o["サイト名"] === "Amazon") { c1 += 1; p1 += o["販売価格"] || 0; }
    else { c2 += 1; p2 += o["販売価格"] || 0; }
  }
  return { c1, p1, c2, p2 };
}

// 注文明細配列から、件数・卸値・売上・送料・利益の合計を算出する（月次データ用）
function sumMetrics(orders) {
  let count = 0, wholesale = 0, sales = 0, shipping = 0, profit = 0;
  for (const o of orders) {
    count += 1;
    wholesale += o["卸値"] || 0;
    sales += o["販売価格"] || 0;
    shipping += o["配送料金"] || 0;
    profit += o["利益"] || 0;
  }
  return { count, wholesale, sales, shipping, profit };
}

// 選択されている期間・状況・仕入先のフィルターに応じて、
// 月次データ・注文リスト・注文グラフをまとめて再描画する
function renderForSelection() {
  const range = computeRangeForPreset(filterPeriodKey);
  const items = getDisplayItems();
  const periodOrders = applyFilters(range ? ordersInRange(range.start, range.end) : []);

  // --- 注文グラフ用データを組み立てる（期間を月または日に分けてバーにする） ---
  const labels = items.map((item) => item.label);
  const azCount = [], azPrice = [], mcCount = [], mcPrice = [];
  for (const item of items) {
    const t = siteTotals(applyFilters(ordersInRange(item.start, item.end)));
    azCount.push(t.c1); azPrice.push(t.p1);
    mcCount.push(t.c2); mcPrice.push(t.p2);
  }
  renderChartCore(labels, azCount, azPrice, mcCount, mcPrice);

  // --- 月次データ: サイト別(A/M)と合計の3行で、件数・卸値・売上・送料・利益を出す ---
  const tbody = document.getElementById("monthSummaryBody");
  const caption = document.getElementById("monthSummaryCaption");
  caption.textContent = range ? `${range.start} 〜 ${range.end}` : "未選択";
  let rows = "";
  if (range) {
    const azOrders = periodOrders.filter((o) => o["サイト名"] === "Amazon");
    const mcOrders = periodOrders.filter((o) => o["サイト名"] !== "Amazon");
    const rowDefs = [
      ["A", "site-amazon", sumMetrics(azOrders)],
      ["M", "site-mercari", sumMetrics(mcOrders)],
      ["合計", "", sumMetrics(periodOrders)],
    ];
    rows = rowDefs.map(([label, cls, m]) => `<tr>
      <td class="${cls}">${label}</td>
      <td>${m.count.toLocaleString("ja-JP")}件</td>
      <td>${formatYen(m.wholesale)}</td>
      <td>${formatYen(m.sales)}</td>
      <td>${formatYen(m.shipping)}</td>
      <td>${formatYen(m.profit)}</td>
    </tr>`).join("");
  }
  tbody.innerHTML = rows || `<tr><td colspan="6">選択してください</td></tr>`;

  // --- 注文リスト: 選択範囲・フィルターに含まれる注文をまとめて出す ---
  renderOrderList(periodOrders, range ? `${range.start} 〜 ${range.end}` : "選択なし");
}

// 期間・状況・仕入先・表示タイプ・リセットの各コントロールを配線する
function wireFilterControls() {
  document.getElementById("periodSelect").addEventListener("change", (e) => {
    filterPeriodKey = e.target.value;
    document.getElementById("customRangeFields").hidden = filterPeriodKey !== "custom";
    renderForSelection();
  });
  document.getElementById("customRangeStart").addEventListener("change", (e) => {
    customRangeStart = e.target.value;
    renderForSelection();
  });
  document.getElementById("customRangeEnd").addEventListener("change", (e) => {
    customRangeEnd = e.target.value;
    renderForSelection();
  });
  document.getElementById("statusFilterSelect").addEventListener("change", (e) => {
    filterStatusKey = e.target.value;
    renderForSelection();
  });

  wireCheckboxDropdown({
    dropdownId: "supplierDropdown", triggerId: "supplierTrigger", panelId: "supplierPanel",
    onChange: (checked) => {
      filterSuppliers = checked;
      updateSupplierTriggerLabel();
      renderForSelection();
    },
  });
  wireCheckboxDropdown({
    dropdownId: "displayTypeDropdown", triggerId: "displayTypeTrigger", panelId: "displayTypePanel",
    onChange: (checked) => {
      updateDisplayTypeTriggerLabel(checked);
      document.getElementById("orderListPanel").hidden = !checked.has("list");
      document.getElementById("orderGraphPanel").hidden = !checked.has("graph");
    },
  });

  document.getElementById("resetFilterButton").addEventListener("click", () => {
    filterPeriodKey = "month";
    filterStatusKey = "before_shipping";
    filterSuppliers = new Set(["自社", "取引先", "その他"]);
    customRangeStart = "";
    customRangeEnd = "";
    document.getElementById("periodSelect").value = "month";
    document.getElementById("customRangeFields").hidden = true;
    document.getElementById("customRangeStart").value = "";
    document.getElementById("customRangeEnd").value = "";
    document.getElementById("statusFilterSelect").value = "before_shipping";
    document.querySelectorAll("#supplierPanel input").forEach((cb) => { cb.checked = true; });
    document.querySelectorAll("#displayTypePanel input").forEach((cb) => { cb.checked = cb.value === "list"; });
    updateSupplierTriggerLabel();
    updateDisplayTypeTriggerLabel(new Set(["list"]));
    document.getElementById("orderListPanel").hidden = false;
    document.getElementById("orderGraphPanel").hidden = true;
    renderForSelection();
  });
}

// チェックボックス付きプルダウン（仕入先・表示タイプ共通）の開閉とチェック変更を配線する
function wireCheckboxDropdown({ dropdownId, triggerId, panelId, onChange }) {
  const dropdown = document.getElementById(dropdownId);
  const trigger = document.getElementById(triggerId);
  const panel = document.getElementById(panelId);
  trigger.addEventListener("click", () => {
    panel.hidden = !panel.hidden;
  });
  document.addEventListener("click", (e) => {
    if (!dropdown.contains(e.target)) panel.hidden = true;
  });
  panel.addEventListener("change", () => {
    const checked = new Set(
      Array.from(panel.querySelectorAll("input:checked")).map((cb) => cb.value)
    );
    onChange(checked);
  });
}

// 仕入先プルダウンのトリガー表示を、選択中のチェックボックスから組み立てる
function updateSupplierTriggerLabel() {
  const trigger = document.getElementById("supplierTrigger");
  const n = filterSuppliers.size;
  if (n === 0) trigger.textContent = "未選択";
  else if (n === 3) trigger.textContent = "自社、取引先、その他";
  else trigger.textContent = Array.from(filterSuppliers).join("、");
}

// 表示タイププルダウンのトリガー表示を、選択中のチェックボックスから組み立てる
function updateDisplayTypeTriggerLabel(checked) {
  const trigger = document.getElementById("displayTypeTrigger");
  const labelMap = { list: "注文リスト", graph: "注文グラフ" };
  const labels = Array.from(checked).map((v) => labelMap[v]);
  trigger.textContent = labels.length ? labels.join("、") : "未選択";
}

// 注文状況のプルダウンが変更されたら、確認ダイアログを出してからSupabaseへ反映する
function wireStatusSelects() {
  document.getElementById("orderListBody").addEventListener("change", async (e) => {
    const select = e.target.closest(".status-select");
    if (!select) return;

    const id = Number(select.dataset.id);
    const newStatus = select.value;
    const previousStatus = select.dataset.prev;

    if (!window.confirm(`現在の注文状況を「${newStatus}」にします。よろしいですか？`)) {
      select.value = previousStatus;
      return;
    }

    select.disabled = true;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/update_order_status`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        },
        body: JSON.stringify({ p_id: id, p_status: newStatus }),
      });
      if (!res.ok) {
        throw new Error(await res.text());
      }

      // 画面上のデータにも反映し、再読み込みなしでグレーアウト表示を更新する
      for (const months of Object.values(ORDER_LIST)) {
        const target = months.find((o) => o["一意キー"] === id);
        if (target) target["注文状況"] = newStatus;
      }
      select.dataset.prev = newStatus;
      const needsNothing = statusStage(newStatus) === 5 || newStatus === "キャンセル済み";
      select.closest("tr").classList.toggle("row-cancelled", needsNothing);
    } catch (err) {
      alert("更新に失敗しました: " + err.message);
      select.value = previousStatus;
    } finally {
      select.disabled = false;
    }
  });
}

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showLoginScreen() {
  document.getElementById("loginScreen").hidden = false;
  document.getElementById("dashboardScreen").hidden = true;
}

// 「注文履歴_表示用」ビューを1000件ずつページ送りして全件取得する
async function fetchAllOrderRows() {
  const pageSize = 1000;
  let from = 0;
  let allRows = [];
  while (true) {
    const { data, error } = await supabaseClient
      .from("注文履歴_表示用")
      .select("*")
      .order("一意キー")
      .range(from, from + pageSize - 1);
    if (error) throw error;
    allRows = allRows.concat(data);
    if (data.length < pageSize) break;
    from += pageSize;
  }
  return allRows;
}

// 取得した行から、グラフ用の月次集計（取消済みは除外）を組み立てる
function buildMonthlyData(rows) {
  const monthly = {};
  for (const r of rows) {
    if (r["注文状況"] === "取消済み") continue;
    const ym = r["注文日時"] ? r["注文日時"].slice(0, 7) : null;
    if (!ym) continue;
    const site = r["サイト名"];
    monthly[ym] = monthly[ym] || {};
    monthly[ym][site] = monthly[ym][site] || { count: 0, price: 0 };
    monthly[ym][site].count += 1;
    monthly[ym][site].price += Number(r["販売価格"]) || 0;
  }
  const months = Object.keys(monthly).sort();
  const sites = ["Amazon", "メルカリShops"];
  const data = { months };
  for (const site of sites) {
    data[site] = {
      count: months.map((m) => (monthly[m][site] || { count: 0 }).count),
      price: months.map((m) => (monthly[m][site] || { price: 0 }).price),
    };
  }
  return data;
}

// サイト名の表示用ラベル（内部データのキー自体は"Amazon"/"メルカリShops"のまま変更しない）
function siteLabel(name) {
  if (name === "Amazon") return "Site_A";
  if (name === "メルカリShops") return "Site_M";
  return name;
}

// SKUの先頭1文字で仕入先を判定する（aなら自社、bなら取引先、それ以外は他社）
function supplierLabel(sku) {
  if (!sku) return "他社";
  const head = sku.charAt(0);
  if (head === "a") return "自社";
  if (head === "b") return "取引先";
  return "他社";
}

// SKUに埋め込まれた13桁のJANを抜き出す
function extractJan(sku) {
  if (!sku) return null;
  const m = sku.match(/\d{13}/);
  return m ? m[0] : null;
}

// SKUから抜き出したJANで、商品画像の想定パスを返す
// （実際に画像が存在するかはクリック時にimgの読み込み成否で判定する）
function extractJanImagePath(sku) {
  const jan = extractJan(sku);
  return jan ? `images/${jan}.jpg` : null;
}

// 取得した行を、注文リスト表示用に月ごとへ整形する（取消済みも含む）
function buildOrderListByMonth(rows) {
  const byMonth = {};
  for (const r of rows) {
    const ym = r["注文日時"] ? r["注文日時"].slice(0, 7) : null;
    if (!ym) continue;
    (byMonth[ym] = byMonth[ym] || []).push({
      "一意キー": r["一意キー"],
      "サイト名": r["サイト名"],
      "注文番号": r["注文番号"],
      "SKU": r["SKU"],
      "JAN": extractJan(r["SKU"]),
      "数量": r["数量"],
      "商品名": r["商品名"],
      "販売価格": r["販売価格"] != null ? Number(r["販売価格"]) : null,
      "卸値": r["卸値"] != null ? Number(r["卸値"]) : null,
      "配送サイズ": r["配送サイズ"],
      "配送料金": r["配送料金"] != null ? Number(r["配送料金"]) : null,
      "利益": r["利益"] != null ? Number(r["利益"]) : null,
      "画像": extractJanImagePath(r["SKU"]),
      "注文日時": r["注文日時"],
      "出荷日時": r["出荷日時"],
      "注文状況": r["注文状況"],
    });
  }
  return byMonth;
}

// 「システム状態」テーブルから、GASがGmailを最後にチェックした時刻を取得して表示する
// （新規注文が見つかったかどうかに関わらず記録されている値）
async function renderLastChecked() {
  const el = document.getElementById("lastUpdated");
  try {
    const { data, error } = await supabaseClient
      .from("システム状態")
      .select("更新日時")
      .eq("キー", "Gmail最終チェック")
      .maybeSingle();
    if (error || !data) {
      el.textContent = "";
      return;
    }
    // この値は「システム状態」テーブルのtimestamptz（オフセット付き）を
    // そのまま受け取っているため、注文データ側（オフセット無しのJST文字列）用の
    // formatDateTimeではなく、ここでJST表示に変換する
    const checkedAt = new Date(data["更新日時"]);
    el.textContent = "最終更新日時: " + checkedAt.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" });
  } catch (e) {
    el.textContent = "";
  }
}

// ログイン成功後に呼ばれる: データを取得して画面を組み立てる
async function showDashboard() {
  document.getElementById("loginScreen").hidden = true;
  document.getElementById("dashboardScreen").hidden = false;
  const notice = document.getElementById("loadingNotice");
  notice.hidden = false;
  notice.textContent = "データを読み込み中...";
  try {
    const rows = await fetchAllOrderRows();
    DATA = buildMonthlyData(rows);
    ORDER_LIST = buildOrderListByMonth(rows);
    notice.hidden = true;

    // GASが「新規注文が来ていないか見に行った」時刻を表示する
    // （新規注文の有無に関わらず、チェックに行くたびに記録されている値）
    await renderLastChecked();

    // 初期表示は期間:月、状況:発送前、仕入先:すべて、表示タイプ:注文リスト
    // （filterPeriodKey等の既定値、およびHTML側のチェック済み状態と一致させている）
    renderForSelection();
  } catch (e) {
    notice.hidden = false;
    notice.textContent = "データの読み込みに失敗しました: " + e.message;
    console.error(e);
  }
}

function wireLoginForm() {
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;
    const errorEl = document.getElementById("loginError");
    const submitBtn = document.getElementById("loginSubmit");
    errorEl.hidden = true;
    submitBtn.disabled = true;
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    submitBtn.disabled = false;
    if (error) {
      errorEl.textContent = "ログインできませんでした。メールアドレスまたはパスワードをご確認ください。";
      errorEl.hidden = false;
    }
    // 成功時はonAuthStateChangeがSIGNED_INを検知してshowDashboard()を呼ぶ
  });
}

function wireLogoutButton() {
  document.getElementById("logoutButton").addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
  });
}

// イベント配線は1回だけ行う（ログイン状態・データの有無に関係ない部分）
wireFilterControls();
wireStatusSelects();
wireTruncateClicks();
wireLoginForm();
wireLogoutButton();

supabaseClient.auth.onAuthStateChange((event) => {
  if (event === "SIGNED_IN") showDashboard();
  if (event === "SIGNED_OUT") showLoginScreen();
});

(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    await showDashboard();
  } else {
    showLoginScreen();
  }
})();
</script>
