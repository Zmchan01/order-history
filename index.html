}

// ■フィルター設定（どの絞り込み項目を表示するか）と、その保存パターン
// 表示・非表示の単位（key）の一覧（範囲指定の上限側は下限側と同じkeyなので除く）
const KEEPA_FILTER_GROUPS = KEEPA_FILTERS.filter((f) => f.range !== "end").map((f) => ({ key: f.key, label: f.label }));
// フィルター設定のポップアップでの種類分け（[見出し, [key, ...]]）。どれにも入らないkeyは「その他」に出す
const KEEPA_FILTER_CATEGORIES = [
  ["基本", ["kfKeyword", "kfMaker", "kfCategory", "kfSubCategory", "kfRelease", "kfShipSize"]],
  ["在庫", ["kfStock"]],
  ["点数・利益", ["kfScore", "kfProfit", "kfBuy", "kfBuyProfit", "kfPattern"]],
  ["ランキング・売れ行き", ["kfRank", "kfDrops30", "kfDrops90", "kfDrops7", "kfHigh30", "kfMonthly"]],
  ["価格", ["kfList", "kfSell", "kfDiscount", "kfNoDrop", "kfOverList", "kfHighRate30"]],
  ["出品者・Amazon", ["kfSellers", "kfUsedSellers", "kfAmazon", "kfOos90"]],
];
// 種類ごとに見出し＋チェックボックスの並びを作る（items＝[{value, label, checked, help}]、groupOf＝value→見出し）
function keepaGroupedChecksHtml(items, categories, groupOf) {
  const groups = new Map(categories.map((c) => [c, []]));
  for (const it of items) {
    const g = groupOf(it.value);
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(it);
  }
  return [...groups].filter(([, list]) => list.length).map(([title, list]) =>
    `<div class="keepa-fm-group"><div class="keepa-fm-group-title">${escapeKeepa(title)}</div><div class="keepa-fm-grid">` +
    list.map((it) => `<label class="keepa-fm-item"><input type="checkbox" value="${escapeKeepa(it.value)}"${it.checked ? " checked" : ""}>` +
      `<span>${escapeKeepa(it.label)}</span>${it.help || ""}</label>`).join("") + `</div></div>`).join("");
}
// 「デフォルト」パターン＝10項目＋値（旧フィルター「あ」の内容。コードで固定。上書き・削除はできない）
// 値：売れ筋ポイント70点〜・想定利益1,500円〜・大ランキング名おもちゃ・売れた回数(30日)8回以上（在庫数はチェックなし）
const KEEPA_DEFAULT_PATTERN = "デフォルト";
const KEEPA_DEFAULT_KEYS = ["kfKeyword", "kfMaker", "kfStock", "kfScore", "kfProfit", "kfBuy", "kfBuyProfit",
  "kfCategory", "kfDrops30", "kfSellers"];
const KEEPA_DEFAULT_VALUES = { kfScoreMin: "70", kfProfitMin: "1500", kfCategory: "おもちゃ", kfDrops30Min: "8" };
// 用途別の固定パターン（コードで固定。上書き・削除はできない）
// keys＝表示する項目、values＝選んだときに入れる条件（id→値。書いていない項目は「全て」・空に戻す）
const KEEPA_PRESET_PATTERNS = {
  // 売価更新用：今扱える商品（在庫あり）で、ランキングが良く、実際に売れている
  "売価更新用": {
    keys: ["kfKeyword", "kfMaker", "kfStock", "kfRank", "kfDrops30", "kfDrops7", "kfScore", "kfCategory"],
    values: { kfStock: "在庫数_TC,在庫数_自社", kfRankMax: "50000", kfDrops30Min: "1" },
  },
  // 探すやつ：売れ筋のある商品（発注用にも使う）。10万位以内・Amazonが長期的に出品していない・売れた実績あり
  // （売れ筋パターン「Amazon不在」＝90日間ずっとAmazon本体の在庫が無い。Amazonが一度も出品していない商品も含む）
  "探すやつ": {
    keys: ["kfKeyword", "kfMaker", "kfRank", "kfPattern", "kfDrops30", "kfScore", "kfProfit", "kfSellers", "kfCategory"],
    values: { kfRankMax: "100000", kfPattern: "Amazon不在", kfDrops30Min: "1" },
  },
  // 買うやつ：買い時のある商品（刈り取り・在庫として保管）。ランキングが良い（5万位以内）・割引率50%以上（半額以下）
  "買うやつ": {
    keys: ["kfKeyword", "kfMaker", "kfRank", "kfDiscount", "kfBuy", "kfBuyProfit", "kfDrops30", "kfCategory"],
    values: { kfRankMax: "50000", kfDiscountMin: "50" },
  },
};
// 上書き・削除できないパターン名（デフォルト＋固定パターン）
const keepaIsFixedPattern = (name) => name === KEEPA_DEFAULT_PATTERN || !!KEEPA_PRESET_PATTERNS[name];
// 保存したパターン（{patterns: {名前: {keys: [key, ...], values: {id: 値}}}, current: 今選んでいる名前}）
// patterns はDB（リサーチ_フィルター保存）から読み込み、ブラウザには current（今選んでいる名前）だけを保存する
// values＝保存した時点の絞り込み欄の値（売れ筋ポイント・想定利益・メーカーの選択・キーワード等）。送信で絞り込み欄に戻す
// （以前の保存形式 {名前: [key, ...]}（値なし）もそのまま読める。ブラウザごと・端末ごとの保存。読み書きできない環境でも動くよう try で囲む）
const KEEPA_PATTERN_STORAGE = "keepaFilterPatterns_v1";
function loadKeepaPatternState() {
  try {
    const s = JSON.parse(localStorage.getItem(KEEPA_PATTERN_STORAGE) || "null");
    if (s && s.patterns && typeof s.patterns === "object") return s;
  } catch (e) { /* 読めなければ初期状態 */ }
  return { patterns: {}, current: KEEPA_DEFAULT_PATTERN };
}
// ブラウザには「今選んでいるフィルター名」だけを残す（保存したフィルター自体はDBの リサーチ_フィルター保存）
// DBから読み込めなかったときは、ブラウザに残っているフィルターを消さないようそのまま保存する
function saveKeepaPatternState() {
  try {
    const toSave = keepaPatternsLoaded ? { patterns: {}, current: keepaPatternState.current } : keepaPatternState;
    localStorage.setItem(KEEPA_PATTERN_STORAGE, JSON.stringify(toSave));
  } catch (e) { /* 保存できない環境（プライベートモード等）でも動かす */ }
  return true;
}
let keepaPatternState = loadKeepaPatternState();

// ■保存したフィルターはDB（テーブル リサーチ_フィルター保存）に置き、どの端末から開いても同じものを使う
// 1行＝1フィルター（名前、項目＝表示する項目のkeyの配列、値＝絞り込み欄の値）。ログイン済みユーザー全員で共通
const KEEPA_FILTER_TABLE = "リサーチ_フィルター保存";
let keepaPatternsLoaded = false;
// 売れ筋タブを初めて開いたときに1回だけ読み込む
// 以前このブラウザに保存していたフィルター（DBに同じ名前が無いもの）は、このときDBへ移す
async function loadKeepaSavedPatterns() {
  if (keepaPatternsLoaded) return;
  try {
    const { data, error } = await supabaseClient.from(KEEPA_FILTER_TABLE).select("名前,項目,値");
    if (error) throw error;
    const db = {};
    for (const r of data) db[r["名前"]] = { keys: r["項目"] || [], values: r["値"] || {} };
    const moves = [];
    for (const [name, p] of Object.entries(keepaPatternState.patterns || {})) {
      if (db[name] || keepaIsFixedPattern(name)) continue;
      const obj = Array.isArray(p) ? { keys: p, values: {} } : { keys: p.keys || [], values: p.values || {} };
      db[name] = obj;
      moves.push({ "名前": name, "項目": obj.keys, "値": obj.values });
    }
    if (moves.length) {
      const { error: e2 } = await supabaseClient.from(KEEPA_FILTER_TABLE).upsert(moves);
      if (e2) throw e2;
    }
    keepaPatternState.patterns = db;
    keepaPatternsLoaded = true;
    saveKeepaPatternState();
  } catch (e) {
    console.error(e);
    alert("保存したフィルターの読み込みに失敗しました: " + e.message);
  }
  // 選んでいたフィルターが無くなっていたらデフォルトに戻し、表示する項目を決め直す
  if (!keepaIsFixedPattern(keepaPatternState.current) && !keepaPatternState.patterns[keepaPatternState.current]) {
    keepaPatternState.current = KEEPA_DEFAULT_PATTERN;
  }
  keepaVisibleKeys = new Set(keepaPatternKeys(keepaPatternState.current));
}
// 1つのフィルターをDBに保存（同じ名前があれば上書き）。失敗したら false
async function saveKeepaPatternToDb(name, p) {
  const { error } = await supabaseClient.from(KEEPA_FILTER_TABLE)
    .upsert({ "名前": name, "項目": p.keys, "値": p.values, "更新日時": new Date().toISOString() });
  if (error) { alert("保存に失敗しました: " + error.message); return false; }
  return true;
}
// 1つのフィルターをDBから削除。失敗したら false
async function deleteKeepaPatternFromDb(name) {
  const { error } = await supabaseClient.from(KEEPA_FILTER_TABLE).delete().eq("名前", name);
  if (error) { alert("削除に失敗しました: " + error.message); return false; }
  return true;
}
// パターン名 → 表示する項目のkey（存在しない項目のkeyは除く）
function keepaPatternKeys(name) {
  const saved = keepaPatternState.patterns[name];
  const keys = name === KEEPA_DEFAULT_PATTERN ? KEEPA_DEFAULT_KEYS
    : KEEPA_PRESET_PATTERNS[name] ? KEEPA_PRESET_PATTERNS[name].keys
    : Array.isArray(saved) ? saved : saved && saved.keys;
  const valid = new Set(KEEPA_FILTER_GROUPS.map((g) => g.key));
  return (keys || KEEPA_DEFAULT_KEYS).filter((k) => valid.has(k));
}
// パターン名 → 選んだときに絞り込み欄へ入れる値（id→値）。値を持たないパターン（以前の保存形式）は null
function keepaPatternValues(name) {
  if (name === KEEPA_DEFAULT_PATTERN) return KEEPA_DEFAULT_VALUES;
  if (KEEPA_PRESET_PATTERNS[name]) return KEEPA_PRESET_PATTERNS[name].values;
  const saved = keepaPatternState.patterns[name];
  return saved && !Array.isArray(saved) && saved.values ? saved.values : null;
}
// 保存用：チェックした項目（keys）と、その項目の今の絞り込み欄の値（values）をまとめる
// （絞り込み欄に表示していない項目は値が無いので「全て」として保存される）
function keepaPatternToSave(keys) {
  const now = collectKeepaFilters();
  const values = {};
  for (const f of KEEPA_FILTERS) {
    if (keys.includes(f.key) && now[f.id] && now[f.id] !== "all") values[f.id] = now[f.id];
  }
  return { keys, values };
}
if (!keepaIsFixedPattern(keepaPatternState.current) && !keepaPatternState.patterns[keepaPatternState.current]) {
  keepaPatternState.current = KEEPA_DEFAULT_PATTERN;
}
// 今、絞り込み欄に表示している項目のkey
let keepaVisibleKeys = new Set(keepaPatternKeys(keepaPatternState.current));
// 表示中の項目のkeyを、項目の並び順で返す（保存用）
const keepaVisibleKeyList = () => KEEPA_FILTER_GROUPS.map((g) => g.key).filter((k) => keepaVisibleKeys.has(k));
// 今の表示が、選んでいるパターンの保存内容と違うか（未保存の変更があるか）
const keepaPatternDirty = () =>
  keepaVisibleKeyList().join(",") !== keepaPatternKeys(keepaPatternState.current).join(",");

// フィルター設定のポップアップ（初めて開くときに1回だけ作る）
function ensureKeepaFilterModal() {
  if (document.getElementById("keepaFilterModal")) return;
  const wrap = document.createElement("div");
  wrap.className = "modal-overlay";
  wrap.id = "keepaFilterModal";
  wrap.hidden = true;
  wrap.innerHTML = `<div class="modal-box modal-box-wide">` +
    `<button type="button" class="modal-close" id="keepaFilterModalClose" aria-label="閉じる">×</button>` +
    `<div class="modal-scroll" id="keepaFilterModalBody"></div></div>`;
  document.body.appendChild(wrap);
  // ×ボタン・ポップアップの外側クリックで閉じる
  document.getElementById("keepaFilterModalClose").addEventListener("click", () => { wrap.hidden = true; });
  wrap.addEventListener("click", (e) => { if (e.target === wrap) wrap.hidden = true; });
}

// フィルター設定のポップアップ内で選んでいる状態（下書き）。「送信」を押すまで絞り込み欄には反映しない
// pattern＝選んでいるフィルター名、keys＝チェックしている項目のkey。ポップアップを開くたびに今の状態から作り直す
let keepaFmDraft = null;
function resetKeepaFmDraft() {
  keepaFmDraft = { pattern: keepaPatternState.current, keys: new Set(keepaVisibleKeys) };
}
// 下書きのkeyを、項目の並び順で返す（保存用）
const keepaFmDraftKeyList = () => KEEPA_FILTER_GROUPS.map((g) => g.key).filter((k) => keepaFmDraft.keys.has(k));

// フィルター設定のポップアップの中身を描画する（下書きの状態を表示する）
function renderKeepaFilterModal(status = "") {
  if (!keepaFmDraft) resetKeepaFmDraft();
  const body = document.getElementById("keepaFilterModalBody");
  const cur = keepaFmDraft.pattern;
  const names = [KEEPA_DEFAULT_PATTERN, ...Object.keys(KEEPA_PRESET_PATTERNS),
    ...Object.keys(keepaPatternState.patterns).filter((n) => !KEEPA_PRESET_PATTERNS[n])];
  const isFixed = keepaIsFixedPattern(cur);
  // 選んでいるフィルターの保存内容と、チェックの状態が違うか
  const dirty = keepaFmDraftKeyList().join(",") !== keepaPatternKeys(cur).join(",");
  body.innerHTML =
    `<h3 class="modal-product-title">フィルター設定</h3>` +
    `<div class="keepa-fm-row"><label class="filter-field"><span class="filter-label">保存したフィルター</span>` +
    `<select id="kfmPattern">${names.map((n) => `<option value="${escapeKeepa(n)}"${n === cur ? " selected" : ""}>` +
      `${escapeKeepa(n)}</option>`).join("")}</select></label>` +
    `<button type="button" class="detail-button" id="kfmDelete"${isFixed ? " disabled" : ""}>このフィルターを削除</button></div>` +
    `<p class="caption">チェックを入れた項目が絞り込み欄に表示されます。「送信」を押すと反映されます（保存しなくても今回だけ使えます）。` +
    `保存すると、絞り込み欄に今入っている値（売れ筋ポイント・想定利益・メーカー等）も一緒に保存され、そのフィルターを選んで送信すると戻ります。</p>` +
    `<div class="keepa-fm-row"><button type="button" class="detail-button" id="kfmAll">すべて選択</button>` +
    `<button type="button" class="detail-button" id="kfmNone">すべて解除</button></div>` +
    // 種類（基本・在庫・点数・利益…）ごとに見出しを付けて並べる
    keepaGroupedChecksHtml(
      KEEPA_FILTER_GROUPS.map((g) => ({ value: g.key, label: g.label, checked: keepaFmDraft.keys.has(g.key), help: keepaHelpMark(g.key) })),
      KEEPA_FILTER_CATEGORIES.map(([t]) => t),
      (key) => (KEEPA_FILTER_CATEGORIES.find(([, keys]) => keys.includes(key)) || ["その他"])[0]) +
    `<div class="keepa-fm-footer"><span class="keepa-fm-status">${escapeKeepa(status || (dirty ? "未保存の変更があります" : ""))}</span>` +
    `<button type="button" class="detail-button" id="kfmSave">上書き保存</button>` +
    `<button type="button" class="detail-button" id="kfmSaveAs">新しいフィルターとして保存</button>` +
    `<button type="button" class="detail-button keepa-search-button" id="kfmSubmit">送信</button></div>`;

  // チェックの付け外し：下書きだけ変える（絞り込み欄は送信まで変えない）
  body.querySelectorAll(".keepa-fm-grid input[type=checkbox]").forEach((cb) => {
    cb.addEventListener("change", () => {
      if (cb.checked) keepaFmDraft.keys.add(cb.value); else keepaFmDraft.keys.delete(cb.value);
      renderKeepaFilterModal();
    });
  });
  // すべて選択・すべて解除（下書きだけ）
  document.getElementById("kfmAll").addEventListener("click", () => {
    keepaFmDraft.keys = new Set(KEEPA_FILTER_GROUPS.map((g) => g.key));
    renderKeepaFilterModal();
  });
  document.getElementById("kfmNone").addEventListener("click", () => {
    keepaFmDraft.keys = new Set();
    renderKeepaFilterModal();
  });
  // 保存したフィルターを選ぶ：そのフィルターの項目にチェックを付け直す（下書きだけ。送信で反映）
  document.getElementById("kfmPattern").addEventListener("change", (e) => {
    keepaFmDraft.pattern = e.target.value;
    keepaFmDraft.keys = new Set(keepaPatternKeys(keepaFmDraft.pattern));
    // 選び直した印（同じフィルターを選び直して送信したときも、保存した値に戻すため）
    keepaFmDraft.picked = true;
    renderKeepaFilterModal();
  });
  // 上書き保存：確認のうえ、選んでいるフィルターに今のチェック状態と絞り込み欄の値をDBへ保存する
  // （デフォルト・固定パターンは不可）。反映は送信で
  document.getElementById("kfmSave").addEventListener("click", async () => {
    const name = keepaFmDraft.pattern;
    if (keepaIsFixedPattern(name)) {
      alert(`「${name}」は上書きできません。「新しいフィルターとして保存」をお使いください。`);
      return;
    }
    if (!confirm(`「${name}」の絞り込み内容に変更を加えても良いですか？`)) return;
    const p = keepaPatternToSave(keepaFmDraftKeyList());
    if (!(await saveKeepaPatternToDb(name, p))) return;
    keepaPatternState.patterns[name] = p;
    renderKeepaFilters();   // 絞り込み欄のフィルター名の「＊」（未保存の印）を更新するだけ
    renderKeepaFilterModal("保存しました（「送信」で反映）");
  });
  // 新しいフィルターとして保存：名前を付けて保存し、そのフィルターを選んだ状態にする。反映は送信で
  document.getElementById("kfmSaveAs").addEventListener("click", async () => {
    const name = (prompt("新しいフィルターの名前を入力してください") || "").trim();
    if (!name) return;
    if (keepaIsFixedPattern(name)) {
      alert(`「${name}」という名前は使えません。`);
      return;
    }
    if (keepaPatternState.patterns[name] && !confirm(`「${name}」は既にあります。上書きしますか？`)) return;
    const p = keepaPatternToSave(keepaFmDraftKeyList());
    if (!(await saveKeepaPatternToDb(name, p))) return;
    keepaPatternState.patterns[name] = p;
    keepaFmDraft.pattern = name;
    renderKeepaFilterModal("保存しました（「送信」で反映）");
  });
  // 削除：選んでいるフィルターを消して、下書きをデフォルトに戻す
  // （今、絞り込み欄で使っているフィルターを消したときは、表示はそのままで名前だけデフォルトにする）
  document.getElementById("kfmDelete").addEventListener("click", async () => {
    const name = keepaFmDraft.pattern;
    if (keepaIsFixedPattern(name) || !confirm(`「${name}」を削除しますか？`)) return;
    if (!(await deleteKeepaPatternFromDb(name))) return;
    delete keepaPatternState.patterns[name];
    if (keepaPatternState.current === name) keepaPatternState.current = KEEPA_DEFAULT_PATTERN;
    keepaFmDraft.pattern = KEEPA_DEFAULT_PATTERN;
    keepaFmDraft.keys = new Set(KEEPA_DEFAULT_KEYS);
    saveKeepaPatternState();
    renderKeepaFilters();
    renderKeepaFilterModal("削除しました");
  });
  // 送信：下書き（選んだフィルター・チェックした項目）を絞り込み欄に反映して検索し、ポップアップを閉じる
  // 別のフィルターに切り替えたときは、そのフィルターの保存値（固定パターン・値を保存したパターン）も入れる
  document.getElementById("kfmSubmit").addEventListener("click", () => {
    const changed = keepaPatternState.current !== keepaFmDraft.pattern || keepaFmDraft.picked;
    keepaPatternState.current = keepaFmDraft.pattern;
    keepaVisibleKeys = new Set(keepaFmDraft.keys);
    saveKeepaPatternState();
    renderKeepaFilters();
    if (changed) applyKeepaPatternValues(keepaPatternState.current);
    document.getElementById("keepaFilterModal").hidden = true;
    document.getElementById("kfSearch").click();
  });
  // 「?」マークのクリックでチェックが切り替わらないようにし、吹き出しだけ出す
  body.querySelectorAll(".keepa-help").forEach((el) => {
    el.addEventListener("click", (e) => { e.preventDefault(); el.focus(); });
  });
}

// ■メーカー絞り込み（検索つきチェックボックス）
// メーカー一覧（[{メーカー名, 件数}]）はテーブル「リサーチ_メーカー一覧」（毎日19:30に件数を書き込み）から、初めて欄を開いたときに1回だけ取得
let keepaMakers = null;
const keepaMakerSelected = new Set();
const KEEPA_MAKER_MAX_SELECT = 50;   // 条件文が長くなりすぎないよう、選べる数の上限
const KEEPA_MAKER_MAX_SHOW = 200;    // 一覧に一度に出す数（それ以上は検索で絞ってもらう）

// メーカー欄のHTML（ボタン＋開閉するパネル）。選択値は hidden の入力欄にJSONで持つ
function keepaMakerFieldHtml(f) {
  return `<div class="filter-field keepa-maker-field">${keepaFilterLabel(f)}` +
    `<button type="button" class="keepa-maker-button" id="kfMakerButton">全て</button>` +
    `<input type="hidden" id="${f.id}" value="">` +
    `<div class="keepa-maker-panel" id="kfMakerPanel" hidden>` +
    `<input type="text" class="keepa-maker-search" id="kfMakerSearch" placeholder="メーカー名で検索">` +
    `<div class="keepa-maker-actions"><span id="kfMakerCount"></span>` +
    `<button type="button" class="detail-button" id="kfMakerClear">選択解除</button></div>` +
    `<div class="keepa-maker-list" id="kfMakerList">読み込み中...</div></div></div>`;
}

// メーカー一覧をテーブルから取得する（1回の取得上限が1000行のため、1000行ずつ分けて取得）
async function loadKeepaMakers() {
  const all = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await supabaseClient
      .from("リサーチ_メーカー一覧")
      .select("メーカー名,件数")
      .order("件数", { ascending: false })
      .order("メーカー名")
      .range(from, from + 999);
    if (error) throw error;
    all.push(...data);
    if (data.length < 1000) break;
  }
  keepaMakers = all;
}

// 選択状態を hidden の値・ボタンの表示・選択数に反映する（メーカー欄が非表示のときは何もしない）
function syncKeepaMakerSelected() {
  if (!document.getElementById("kfMaker")) return;
  const names = [...keepaMakerSelected];
  document.getElementById("kfMaker").value = names.length ? JSON.stringify(names) : "";
  document.getElementById("kfMakerButton").textContent =
    names.length === 0 ? "全て" : names.length === 1 ? names[0] : `${names[0]} 他${names.length - 1}件`;
  document.getElementById("kfMakerCount").textContent = `${names.length}件選択中`;
}

// 検索欄の文字で一覧を絞って描画する（選択中のメーカーは常に先頭に出す。通信はしない）
function renderKeepaMakerList() {
  const box = document.getElementById("kfMakerList");
  if (!keepaMakers || !box) return;
  const kw = document.getElementById("kfMakerSearch").value.trim().toLowerCase();
  const selected = keepaMakers.filter((m) => keepaMakerSelected.has(m["メーカー名"]));
  const hits = keepaMakers.filter((m) => !keepaMakerSelected.has(m["メーカー名"]) &&
    (!kw || m["メーカー名"].toLowerCase().includes(kw)));
  const shown = [...selected, ...hits.slice(0, KEEPA_MAKER_MAX_SHOW)];
  const more = hits.length - Math.min(hits.length, KEEPA_MAKER_MAX_SHOW);
  box.innerHTML = shown.map((m, i) => {
    const name = escapeKeepa(m["メーカー名"]);
    const checked = keepaMakerSelected.has(m["メーカー名"]) ? " checked" : "";
    return `<label class="keepa-maker-item"><input type="checkbox" data-i="${i}"${checked}>` +
      `<span>${name}</span><span class="keepa-maker-num">${m["件数"].toLocaleString()}</span></label>`;
  }).join("") + (shown.length ? "" : `<div class="keepa-maker-note">該当するメーカーがありません</div>`)
    + (more > 0 ? `<div class="keepa-maker-note">ほか${more.toLocaleString()}件（検索で絞ってください）</div>` : "");
  // チェックの付け外し：選択に追加・削除して表示を更新
  box.querySelectorAll("input[type=checkbox]").forEach((cb) => {
    cb.addEventListener("change", () => {
      const name = shown[Number(cb.dataset.i)]["メーカー名"];
      if (cb.checked) {
        if (keepaMakerSelected.size >= KEEPA_MAKER_MAX_SELECT) {
          cb.checked = false;
          alert(`メーカーは${KEEPA_MAKER_MAX_SELECT}件まで選べます`);
          return;
        }
        keepaMakerSelected.add(name);
      } else {
        keepaMakerSelected.delete(name);
      }
      syncKeepaMakerSelected();
    });
  });
}

// メーカー欄の外をクリックしたらパネルを閉じる（ページ全体で1回だけ登録）
document.addEventListener("click", (e) => {
  const panel = document.getElementById("kfMakerPanel");
  if (panel && !panel.hidden && !e.target.closest(".keepa-maker-field")) panel.hidden = true;
});

// メーカー欄の操作（開閉・検索・選択解除）を登録する（メーカー欄が表示されているときだけ）
function wireKeepaMaker() {
  const panel = document.getElementById("kfMakerPanel");
  if (!panel) return;
  document.getElementById("kfMakerButton").addEventListener("click", async () => {
    panel.hidden = !panel.hidden;
    if (panel.hidden) return;
    // 開いたときは選択中のメーカーを先頭に並べ直す
    if (keepaMakers) { renderKeepaMakerList(); return; }
    try {
      await loadKeepaMakers();
      renderKeepaMakerList();
    } catch (e) {
      document.getElementById("kfMakerList").textContent = "メーカー一覧の読み込みに失敗しました: " + e.message;
      console.error(e);
    }
  });
  document.getElementById("kfMakerSearch").addEventListener("input", renderKeepaMakerList);
  document.getElementById("kfMakerClear").addEventListener("click", () => {
    keepaMakerSelected.clear();
    syncKeepaMakerSelected();
    renderKeepaMakerList();
  });
  syncKeepaMakerSelected();
}

// 検索ボタンを押した時点の絞り込み条件（id→選択値）。ページ送りもこの条件で取得する
// （プルダウンを変えただけでは通信しない。検索ボタンでまとめて1回だけ取得する）
let keepaAppliedFilters = {};
let keepaFiltersRendered = false;

// パターンの保存値（固定パターン＝コードの値、保存したパターン＝保存時の値）を絞り込み欄に入れる
// （書いていない項目は「全て」・空に戻す。メーカーは保存した選択に戻し、無ければ外す）
// 値を持たないパターン（デフォルト・以前の保存形式）なら何もせず false を返す
function applyKeepaPatternValues(name) {
  const values = keepaPatternValues(name);
  if (!values) return false;
  for (const f of KEEPA_FILTERS) {
    const el = document.getElementById(f.id);
    if (!el || f.type === "maker") continue;
    el.value = values[f.id] ?? (f.type === "text" || f.type === "checks" ? "" : "all");
    // チェックボックスの欄（在庫数）は値どおりにチェックを付ける
    if (f.type === "checks") {
      const on = new Set(el.value.split(","));
      document.querySelectorAll(`input[data-for="${f.id}"]`).forEach((cb) => { cb.checked = on.has(cb.value); });
    }
  }
  // メーカーの選択（保存値は選んだメーカー名のJSON配列）
  keepaMakerSelected.clear();
  try {
    for (const n of JSON.parse(values.kfMaker || "[]")) keepaMakerSelected.add(n);
  } catch (e) { /* 読めなければ選択なし */ }
  syncKeepaMakerSelected();
  if (keepaMakers) renderKeepaMakerList();
  return true;
}

// 表示中の絞り込み欄の値を、検索条件（id→値）として集める（非表示の項目は条件に入れない）
function collectKeepaFilters() {
  const applied = {};
  for (const f of KEEPA_FILTERS) {
    const el = document.getElementById(f.id);
    if (!el) continue;
    const v = el.value.trim();
    applied[f.id] = v === "" ? "all" : v;
  }
  return applied;
}

// 絞り込み欄（フィルター設定ボタン・表示中の項目・表示件数・検索等のボタン）を描画する
// フィルター設定で表示項目を変えたときも呼ぶ。表示が続く項目は、入力中の値をそのまま残す
function renderKeepaFilters() {
  keepaFiltersRendered = true;
  const row = document.getElementById("keepaFilterRow");
  // 描き直す前の入力値（id→値）。チェックボックス欄は hidden の値から復元する
  const prev = {};
  for (const f of KEEPA_FILTERS) {
    const el = document.getElementById(f.id);
    if (el) prev[f.id] = el.value;
  }
  const prevPageSize = document.getElementById("kfPageSize")?.value;
  // メーカー欄を非表示にしたら、メーカーの選択も外す（見えない条件が残らないように）
  if (!keepaVisibleKeys.has("kfMaker")) keepaMakerSelected.clear();

  // 先頭：フィルター設定ボタンと、今選んでいるフィルター名（未保存の変更があれば＊）
  let html = `<div class="filter-field keepa-settings-field">` +
    `<button type="button" class="detail-button keepa-settings-button" id="kfSettings">フィルター設定</button>` +
    `<span class="keepa-pattern-name">${escapeKeepa(keepaPatternState.current)}${keepaPatternDirty() ? "＊" : ""}</span></div>`;
  for (const f of KEEPA_FILTERS) {
    if (!keepaVisibleKeys.has(f.key)) continue;
    // テキスト入力の項目（キーワード・小ランキング名）は入力欄
    if (f.type === "text") {
      html += `<label class="filter-field">${keepaFilterLabel(f)}` +
        `<input type="text" class="keepa-text-input" id="${f.id}" placeholder="${escapeKeepa(f.placeholder || "")}"></label>`;
      continue;
    }
    // チェックボックスの欄（在庫数）：チェックの状態を hidden の入力欄に「,」区切りで持つ
    if (f.type === "checks") {
      html += `<div class="filter-field">${keepaFilterLabel(f)}<input type="hidden" id="${f.id}" value="">` +
        f.checks.map(([v, t]) => `<label class="keepa-check"><input type="checkbox" data-for="${f.id}" value="${escapeKeepa(v)}">` +
          `${escapeKeepa(t)}</label>`).join("") + `</div>`;
      continue;
    }
    // メーカーは検索つきチェックボックスの欄
    if (f.type === "maker") {
      html += keepaMakerFieldHtml(f);
      continue;
    }
    const select = `<select id="${f.id}">${f.options
      .map(([v, t]) => `<option value="${escapeKeepa(v)}">${escapeKeepa(t)}</option>`).join("")}</select>`;
    if (f.range === "start") {
      // 範囲指定の下限側：ラベルと下限・上限のプルダウンを1つの枠にまとめる
      html += `<div class="filter-field">${keepaFilterLabel(f)}${select}`;
    } else if (f.range === "end") {
      html += `<span>〜</span>${select}</div>`;
    } else {
      html += `<label class="filter-field">${keepaFilterLabel(f)}${select}</label>`;
    }
  }
  // 表示件数（絞り込み条件ではないため KEEPA_FILTERS とは別に置く。並び替えは一覧の項目名の ▲▼ で行う）
  html += `<label class="filter-field"><span class="filter-label">表示件数</span><select id="kfPageSize">${KEEPA_PAGE_SIZES
    .map((n) => `<option value="${n}"${n === keepaPageSize ? " selected" : ""}>${n}件</option>`).join("")}</select></label>`;
  html += `<button type="button" class="detail-button keepa-search-button" id="kfSearch">検索</button>`;
  html += `<button type="button" class="detail-button" id="kfReset">リセット</button>`;
  html += `<button type="button" class="detail-button" id="kfSortClear">並び替え解除</button>`;
  html += `<button type="button" class="detail-button" id="kfDownload">txtダウンロード</button>`;
  row.innerHTML = html;

  // 入力値を戻す（表示が続く項目だけ）。チェックボックス欄は hidden の値どおりにチェックを付ける
  for (const f of KEEPA_FILTERS) {
    const el = document.getElementById(f.id);
    if (!el || prev[f.id] === undefined || f.type === "maker") continue;
    el.value = prev[f.id];
    if (f.type === "checks") {
      const on = new Set(prev[f.id].split(","));
      row.querySelectorAll(`input[data-for="${f.id}"]`).forEach((cb) => { cb.checked = on.has(cb.value); });
    }
  }
  if (prevPageSize) document.getElementById("kfPageSize").value = prevPageSize;

  // フィルター設定：ポップアップを開く
  document.getElementById("kfSettings").addEventListener("click", () => {
    ensureKeepaFilterModal();
    resetKeepaFmDraft();   // 開くたびに、今の絞り込み欄の状態から選び直す（前回送信しなかった変更は捨てる）
    renderKeepaFilterModal();
    document.getElementById("keepaFilterModal").hidden = false;
  });
  // 並び替え解除：初期（ランキングの良い順のみ）に戻してすぐ取得する（既に初期なら通信しない）
  document.getElementById("kfSortClear").addEventListener("click", () => {
    if (keepaSortIsDefault()) return;
    keepaSorts = KEEPA_DEFAULT_SORTS.map((s) => ({ ...s }));
    loadKeepaPage(1);
  });
  // txtダウンロード：検索で確定した絞り込み結果の全件をtxtで保存する
  document.getElementById("kfDownload").addEventListener("click", (e) => downloadKeepaTxt(e.currentTarget));
  wireKeepaMaker();
  // チェックボックスを付け外ししたら、チェックしている値を hidden の入力欄に「,」区切りで入れる
  row.querySelectorAll("input[type=checkbox][data-for]").forEach((cb) => {
    cb.addEventListener("change", () => {
      const id = cb.dataset.for;
      document.getElementById(id).value = [...row.querySelectorAll(`input[data-for="${id}"]:checked`)]
        .map((x) => x.value).join(",");
    });
  });
  // 検索：表示中の項目の値を条件として確定し、1ページ目から取得する（非表示の項目は条件に入れない）
  const runSearch = () => {
    keepaAppliedFilters = collectKeepaFilters();
    keepaPageSize = Number(document.getElementById("kfPageSize").value);
    loadKeepaPage(1);
  };
  document.getElementById("kfSearch").addEventListener("click", runSearch);
  // 入力欄でEnterを押したときも検索する
  row.querySelectorAll(".keepa-text-input").forEach((el) => {
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });
  });
  // 「?」マークのクリック（タップ）でプルダウンが反応しないようにし、吹き出しだけ出す
  row.querySelectorAll(".keepa-help").forEach((el) => {
    el.addEventListener("click", (e) => { e.preventDefault(); el.focus(); });
  });
  // リセット：表示中の項目を「全て」・空に戻し、表示件数を30件に戻すだけ（通信はしない。検索ボタンで反映）
  document.getElementById("kfReset").addEventListener("click", () => {
    for (const f of KEEPA_FILTERS) {
      const el = document.getElementById(f.id);
      if (!el || f.type === "maker") continue;
      el.value = f.type === "text" || f.type === "checks" ? "" : "all";
    }
    // チェックボックス（在庫数）も外す
    row.querySelectorAll("input[type=checkbox][data-for]").forEach((cb) => { cb.checked = false; });
    // メーカーの選択も外す
    keepaMakerSelected.clear();
    syncKeepaMakerSelected();
    if (keepaMakers) renderKeepaMakerList();
    document.getElementById("kfPageSize").value = String(KEEPA_DEFAULT_PAGE_SIZE);
  });
}

// 検索ボタンで確定した絞り込み条件をSupabaseのクエリに付ける
function applyKeepaFilters(q) {
  const orGroups = [];
  for (const f of KEEPA_FILTERS) {
    const v = keepaAppliedFilters[f.id] || "all";
    q = f.apply(q, v);
    const o = f.ors ? f.ors(v) : null;
    if (o) orGroups.push(o);
  }
  // OR条件が複数あるときは and(or(...),or(...)) の形にまとめて1つにする
  if (orGroups.length === 1) q = q.or(orGroups[0]);
  else if (orGroups.length > 1) q = q.or(`and(${orGroups.map((g) => `or(${g})`).join(",")})`);
  return q;
}

// 読み込みの通し番号：最後に始めた読み込み（最後に送信・検索・ページ移動・並び替えした条件）の結果だけを表示する
// （前の読み込みが遅れて返ってきても、画面を上書きしない）
let keepaLoadSeq = 0;
// 件数を数えた条件（同じ条件でページ移動・並び替えだけしたときは数え直さない）
let keepaCountKey = null;
// 今表示しているページの件数（件数が数えきれなかったときのページ送り用）
let keepaShownCount = 0;

// 件数の部分の表示（数え中・数えきれなかった場合も含む）
function keepaCaptionText(from) {
  const range = `${(from + 1).toLocaleString()}〜${(from + keepaShownCount).toLocaleString()}件目（${keepaSortLabel()}）`;
  if (keepaTotal === undefined) return `件数を数えています… ${range}`;
  if (keepaTotal === null) return `件数を数えきれませんでした（条件を絞ると表示されます） ${range}`;
  return `全${keepaTotal.toLocaleString()}件中 ${range}`;
}

// 指定ページの一覧と総件数をSupabaseから取得して表示する
// 一覧と件数は別々に取得する（それぞれに8秒の制限があるため。件数が重くても一覧は先に出す）
async function loadKeepaPage(page) {
  const seq = ++keepaLoadSeq;
  const isLatest = () => seq === keepaLoadSeq;
  const caption = document.getElementById("keepaListCaption");
  caption.textContent = "読み込み中...";
  // 初回だけ絞り込み欄を描画する（在庫数欄を非表示にしても毎回描き直さないよう、フラグで判定）
  if (!keepaFiltersRendered) {
    // 保存したフィルター（DB）を読み込んでから、選んでいたフィルターの項目で描画する
    await loadKeepaSavedPatterns();
    renderKeepaFilters();
    // 前回、値を持つパターン（売価更新用等・値を保存したパターン）を選んでいたら、その条件で最初から取得する
    if (applyKeepaPatternValues(keepaPatternState.current)) keepaAppliedFilters = collectKeepaFilters();
  }
  if (!isLatest()) return;
  const from = (page - 1) * keepaPageSize;
  // 件数：条件が前回と同じなら数え直さない。違えば一覧と同時に数え始める
  const countKey = JSON.stringify(keepaAppliedFilters);
  let countPromise = null;
  if (countKey !== keepaCountKey) {
    keepaCountKey = countKey;
    keepaTotal = undefined;   // 数えている途中
    const cq = applyKeepaFilters(supabaseClient.from("keepa情報_在庫込み").select("ASIN", { count: "exact", head: true }));
    countPromise = cq.then(({ count, error }) => {
      if (keepaCountKey !== countKey) return;   // その間に条件が変わった
      // 数えきれなかったときは null（同じ条件のままのページ移動では数え直さず、DBの負荷を増やさない）
      if (error) { console.error(error); keepaTotal = null; }
      else keepaTotal = count ?? 0;
    });
  }
  try {
    // ビュー keepa情報_在庫込み（keepa情報＋別テーブル keepa情報_在庫 の在庫数_自社・在庫数_TC）から読む
    let q = supabaseClient
      .from("keepa情報_在庫込み")
      .select([...KEEPA_COLUMNS, "在庫数_自社", "在庫数_TC", "割引率"].join(","));
    q = applyKeepaFilters(q);
    // 並び替え：▲▼で指定した順（先に選んだ項目ほど優先）。空欄は常に最後、全部同じ値ならASIN順
    for (const s of keepaSorts) q = q.order(keepaSortDbCol(s.col), { ascending: s.asc, nullsFirst: false });
    const { data, error } = await q
      .order("ASIN")
      .range(from, from + keepaPageSize - 1);
    if (!isLatest()) return;   // 新しい読み込みが始まっていたら、この結果は表示しない
    if (error) throw error;
    keepaPage = page;
    keepaShownCount = data.length;
    keepaLoaded = true;
    renderKeepaTable(data);
    renderKeepaPagers();
    caption.textContent = !data.length && page === 1 ? "データがありません" : keepaCaptionText(from);
  } catch (e) {
    caption.textContent = "読み込みに失敗しました: " + e.message;
    console.error(e);
    return;
  }
  // 件数が後から届いたら、件数の表示とページ送り（最後のページ番号）を更新する
  if (countPromise) {
    await countPromise;
    if (!isLatest() || !keepaShownCount) return;
    renderKeepaPagers();
    caption.textContent = keepaCaptionText(from);
  }
}

// ■絞り込み結果のtxtダウンロード
// 検索ボタンで確定した条件（一覧と同じ条件・同じ並び順）の全件を、1000件ずつ取得してtxtにする
// 項目：商品名・JAN・個数（常に0）・メーカー名（採用_メーカー名）・定価（採用_定価＝税込）
// 形式：タブ区切り・1行目に見出し・UTF-8（BOM付き。Excel・メモ帳で文字化けしないように）
// JANが複数ある商品は先頭のJANだけを出す。商品名の中のタブ・改行は空白に置き換える
const KEEPA_TXT_CONFIRM_OVER = 10000;   // これより多いときは、取得に時間がかかるので確認する
async function downloadKeepaTxt(btn) {
  if (!keepaLoaded) { alert("先に検索して一覧を表示してください。"); return; }
  if (!keepaShownCount && keepaPage === 1) { alert("ダウンロードする商品がありません。"); return; }
  // 件数が分からない（数え中・数えきれなかった）ときは件数が多い可能性があるので確認する
  const known = typeof keepaTotal === "number";
  if ((!known || keepaTotal > KEEPA_TXT_CONFIRM_OVER) &&
      !confirm(`${known ? keepaTotal.toLocaleString() + "件あります" : "件数が多い可能性があります"}。取得に時間がかかりますが、ダウンロードしますか？`)) return;
  const label = btn.textContent;
  btn.disabled = true;
  const cell = (v) => (v == null ? "" : String(v).replace(/[\t\r\n]+/g, " ").trim());
  const lines = [["商品名", "JAN", "個数", "メーカー名", "定価"].join("\t")];
  try {
    for (let from = 0; ; from += 1000) {
      btn.textContent = `取得中 ${from.toLocaleString()}${known ? "/" + keepaTotal.toLocaleString() : "件"}`;
      let q = supabaseClient.from("keepa情報_在庫込み").select("ASIN,タイトル,JAN,採用_メーカー名,採用_定価");
      q = applyKeepaFilters(q);
      for (const s of keepaSorts) q = q.order(keepaSortDbCol(s.col), { ascending: s.asc, nullsFirst: false });
      const { data, error } = await q.order("ASIN").range(from, from + 999);
      if (error) throw error;
      for (const r of data) {
        const jan = (String(r["JAN"] || "").match(/\d{8,14}/) || [""])[0];
        lines.push([cell(r["タイトル"]), jan, "0", cell(r["採用_メーカー名"]), cell(r["採用_定価"])].join("\t"));
      }
      if (data.length < 1000) break;
    }
    // ファイル名：売れ筋_年月日_時分.txt（日本時間）
    const now = new Date(Date.now() + 9 * 3600 * 1000).toISOString();
    const name = `売れ筋_${now.slice(0, 10).replace(/-/g, "")}_${now.slice(11, 16).replace(":", "")}.txt`;
    const blob = new Blob(["﻿" + lines.join("\r\n") + "\r\n"], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } catch (e) {
    alert("ダウンロードに失敗しました: " + e.message);
    console.error(e);
  } finally {
    btn.textContent = label;
    btn.disabled = false;
  }
}

// 1セル分の表示文字列を作る（数値は3桁区切り、日時は日本時間、空欄は空文字）
function keepaCellText(col, v) {
  if (v == null || v === "") return "";
  // 値崩れなし・定価超え（true/false）は、当てはまるときだけ「○」を出す
  if (typeof v === "boolean") return v ? "○" : "";
  // 発売日は「2024-03-15」で届くので「2024/03/15」に整える
  if (col === "発売日" || col === "採用_発売日") return String(v).replace(/-/g, "/");
  if (KEEPA_DATE_COLUMNS.has(col)) return new Date(v).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" });
  if (typeof v === "number") return v.toLocaleString();
  return String(v);
}

// Amazonの商品ページへのリンク（新しいタブで開く）
// rel="noreferrer" と referrerpolicy="no-referrer" で、Amazon側にこのサイトのURL（リンク元）を送らない
function keepaAmazonLink(asin, innerHtml) {
  const href = `https://www.amazon.co.jp/dp/${encodeURIComponent(asin)}`;
  return `<a href="${href}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">${innerHtml}</a>`;
}

// 今表示しているページの行（ポップアップ表示用。再取得はしない）
let keepaRows = [];

// 行をクリックしたとき、一覧に出していない項目をポップアップ（detailModal）に表示する
function showKeepaDetailModal(r) {
  document.getElementById("modalTitle").textContent = r["タイトル"] ?? r["ASIN"];
  const img = document.getElementById("modalImage");
  img.onerror = null;
  img.removeAttribute("src");
  img.hidden = true;
  // 1つの値の表示（true/false は ○/×、空欄は -）
  const fmt = (col) => {
    const v = r[col];
    if (typeof v === "boolean") return v ? "○" : "×";
    return keepaCellText(col, v) || "-";
  };
  // 差の表示（+1,234 / −1,234 / ±0）。小数は1桁、整数は3桁区切り
  const signed = (d) => {
    const n = Math.round(d * 10) / 10;
    if (n === 0) return "±0";
    const s = Math.abs(n).toLocaleString(undefined, { maximumFractionDigits: 1 });
    return (n > 0 ? "+" : "−") + s;
  };
  const diffSpan = (text) => ` <span class="keepa-diff">(${escapeKeepa(text)})</span>`;
  // 1つの値＋7日基準の差。scale≠1（回数）は7日あたりに換算した値と差を出す
  const withDiff = (col, baseCol, scale) => {
    const text = escapeKeepa(fmt(col));
    const v = r[col], b = r[baseCol];
    if (typeof v !== "number" || typeof b !== "number") return text;
    const scaled = v * scale;
    if (scale === 1) return text + diffSpan(signed(scaled - b));
    const per7 = (Math.round(scaled * 10) / 10).toLocaleString(undefined, { maximumFractionDigits: 1 });
    return text + diffSpan(`7日換算${per7} ${signed(scaled - b)}`);
  };
  let html = "";
  for (const [title, items] of KEEPA_DETAIL_GROUPS) {
    html += `<dt class="keepa-detail-head">${escapeKeepa(title)}</dt>`;
    // 基本の先頭はASIN（Amazonの商品ページへのリンク。リンク元は送らない）
    if (title === "基本") html += `<dt>ASIN</dt><dd>${keepaAmazonLink(r["ASIN"], escapeKeepa(r["ASIN"]))}</dd>`;
    for (const [label, cols, opt] of items) {
      let dd;
      if (opt && opt.now) {
        // 今の値 − 平均（どちらかが空欄なら -）
        dd = opt.avgs.map((a) => {
          const n = r[opt.now], v = r[a];
          return typeof n === "number" && typeof v === "number" ? signed(n - v) : "-";
        }).map(escapeKeepa).join(" / ");
      } else if (opt) {
        dd = cols.map((c, j) => withDiff(c, opt.base[j], opt.scale)).join(" / ");
      } else {
        dd = escapeKeepa(cols.map(fmt).join(" / "));
      }
      html += `<dt>${escapeKeepa(label)}</dt><dd>${dd}</dd>`;
    }
  }
  document.getElementById("modalContent").innerHTML = html;
  document.getElementById("researchChartWrap").hidden = true;
  document.getElementById("detailModal").hidden = false;
}

// 一覧のクリックを1回だけ登録する（ASINのリンクのクリックはポップアップを開かない）
let keepaDetailWired = false;
function wireKeepaDetail() {
  if (keepaDetailWired) return;
  keepaDetailWired = true;
  // ▲▼ボタン：並び替えに追加・切り替え・解除し、今の絞り込み条件のまま1ページ目を取得
  document.getElementById("keepaHeadRow").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-col]");
    if (!b) return;
    const before = JSON.stringify(keepaSorts);
    toggleKeepaSort(b.dataset.col, b.dataset.asc === "1");
    // 初期の1項目だけを外そうとした場合など、結果が変わらなければ通信しない
    if (JSON.stringify(keepaSorts) !== before) loadKeepaPage(1);
  });
  document.getElementById("keepaListBody").addEventListener("click", (e) => {
    if (e.target.closest("a")) return;
    const tr = e.target.closest("tr[data-idx]");
    if (tr) showKeepaDetailModal(keepaRows[Number(tr.dataset.idx)]);
  });
}

// 見出し行と1ページ分の行を描画する
function renderKeepaTable(rows) {
  keepaRows = rows;
  wireKeepaDetail();
  // 項目名：それぞれに ▲（昇順）▼（降順）ボタンを付ける。並び替えに入っている項目は
  // 選んでいる方のボタンを色付きにし、優先順位の番号（①②③…）を付ける
  const head = document.getElementById("keepaHeadRow");
  const NUMS = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯";
  // 表示する列は「表示項目設定」で選んだもの
  const displayCols = keepaDisplayColumnList();
  head.innerHTML = displayCols.map((c) => {
    const col = escapeKeepa(c);
    const i = keepaSorts.findIndex((s) => s.col === c);
    const btn = (asc, mark, tip) => {
      const on = i >= 0 && keepaSorts[i].asc === asc ? " is-active" : "";
      return `<button type="button" class="keepa-sort-btn${on}" data-col="${col}" data-asc="${asc ? 1 : 0}" title="${tip}">${mark}</button>`;
    };
    const num = i >= 0 ? `<span class="keepa-sort-num" title="並び替えの優先順位">${NUMS[i]}</span>` : "";
    // 項目名は短い表示（あれば）にし、元の名前をツールチップで出す
    const short = KEEPA_SHORT_LABELS[c];
    const name = short ? `<span title="${col}">${escapeKeepa(short)}</span>` : col;
    return `<th><span class="keepa-th">${name}${num}<span class="keepa-sort-btns">` +
      `${btn(true, "▲", "昇順（小さい順）：並び替えに追加。もう一度押すと外す")}` +
      `${btn(false, "▼", "降順（大きい順）：並び替えに追加。もう一度押すと外す")}</span></span></th>`;
  }).join("");
  document.getElementById("keepaListBody").innerHTML = rows.map((r, idx) => {
    const tds = displayCols.map((c) => {
      const text = escapeKeepa(keepaCellText(c, keepaValue(r, c)));
      let cls = KEEPA_LONG_COLUMNS.has(c) ? "keepa-long" : KEEPA_TEXT_COLUMNS.has(c) ? "keepa-text" : "";
      // 想定利益・買い時利益がマイナスなら赤字表示
      if ((c === "想定利益" || c === "買い時利益") && r[c] < 0) cls += " keepa-minus";
      // 省略表示されるセルは、マウスを乗せると全文が出るようtitleを付ける
      const title = KEEPA_LONG_COLUMNS.has(c) && text ? ` title="${text}"` : "";
      // タイトルはAmazonの商品ページへのリンクにする（新しいタブで開く。リンク元を送らない）
      // 横幅を取らないよう先頭8文字だけ表示し、続きは「…」（全文はカーソルを合わせると出る）
      if (c === "タイトル" && r["ASIN"]) {
        const full = keepaCellText(c, r[c]);
        const short = full.length > 8 ? full.slice(0, 8) + "…" : full;
        return `<td class="${cls}"${title}>${keepaAmazonLink(r["ASIN"], escapeKeepa(short) || escapeKeepa(r["ASIN"]))}</td>`;
      }
      return `<td class="${cls}"${title}>${text}</td>`;
    }).join("");
    return `<tr class="row-clickable" data-idx="${idx}">${tds}</tr>`;
  }).join("");
  // ページを切り替えたら表の先頭に戻す
  document.querySelector(".keepa-table-wrap").scrollTop = 0;
}

// HTMLとして解釈されないよう文字を置き換える
function escapeKeepa(s) {
  return String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

// 表の上下にページ送り（最初・前へ・ページ番号入力・次へ・最後）を描画する
function renderKeepaPagers() {
  // 最終ページ番号＝総件数÷選択中の表示件数（切り上げ）
  // 件数がまだ分からない（数え中・数えきれなかった）ときは、今のページが満杯なら次のページまで進めるようにする
  const last = typeof keepaTotal === "number"
    ? Math.max(1, Math.ceil(keepaTotal / keepaPageSize))
    : keepaPage + (keepaShownCount >= keepaPageSize ? 1 : 0);
  for (const id of ["keepaPagerTop", "keepaPagerBottom"]) {
    const el = document.getElementById(id);
    el.innerHTML = `
      <button type="button" class="detail-button" data-go="1" ${keepaPage <= 1 ? "disabled" : ""}>最初</button>
      <button type="button" class="detail-button" data-go="${keepaPage - 1}" ${keepaPage <= 1 ? "disabled" : ""}>前へ</button>
      <span><input type="number" min="1" max="${last}" value="${keepaPage}"> / ${last.toLocaleString()} ページ</span>
      <button type="button" class="detail-button" data-go="${keepaPage + 1}" ${keepaPage >= last ? "disabled" : ""}>次へ</button>
      <button type="button" class="detail-button" data-go="${last}" ${keepaPage >= last ? "disabled" : ""}>最後</button>`;
    el.querySelectorAll("button[data-go]").forEach((b) => {
      b.addEventListener("click", () => loadKeepaPage(Number(b.dataset.go)));
    });
    // ページ番号を入力してEnterでそのページへ移動（範囲外は最初/最後に丸める）
    el.querySelector("input").addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const p = Math.min(last, Math.max(1, parseInt(e.target.value, 10) || 1));
      loadKeepaPage(p);
    });
  }
}

// チェックボックス付きプルダウン（仕入先・表示タイプ共通）の開閉とチェック変更を配線する
function wireCheckboxDropdown({ dropdownId, triggerId, panelId, onChange }) {
  const dropdown = document.getElementById(dropdownId);
  const trigger = document.getElementById(triggerId);
  const panel = document.getElementById(panelId);
  trigger.addEventListener("click", () => {
    panel.hidden = !panel.hidden;
  });
  document.addEventListener("click", (e) => {
    if (!dropdown.contains(e.target)) panel.hidden = true;
  });
  panel.addEventListener("change", () => {
    const checked = new Set(
      Array.from(panel.querySelectorAll("input:checked")).map((cb) => cb.value)
    );
    onChange(checked);
  });
}

// 仕入先プルダウンのトリガー表示を、選択中のチェックボックスから組み立てる
function updateSupplierTriggerLabel() {
  const trigger = document.getElementById("supplierTrigger");
  const n = filterSuppliers.size;
  if (n === 0) trigger.textContent = "未選択";
  else if (n === 3) trigger.textContent = "自社、取引先、その他";
  else trigger.textContent = Array.from(filterSuppliers).join("、");
}

// 表示タイププルダウンのトリガー表示を、選択中のチェックボックスから組み立てる
function updateDisplayTypeTriggerLabel(checked) {
  const trigger = document.getElementById("displayTypeTrigger");
  const labelMap = { list: "注文リスト", graph: "注文グラフ" };
  const labels = Array.from(checked).map((v) => labelMap[v]);
  trigger.textContent = labels.length ? labels.join("、") : "未選択";
}

// チェックボックス付きプルダウン（リサーチタブの仕入先・売れ筋）のトリガー表示を
// 選択中のチェックボックスから組み立てる汎用版
function updateTriggerLabel(triggerId, selectedSet, allValues) {
  const trigger = document.getElementById(triggerId);
  const n = selectedSet.size;
  if (n === 0) trigger.textContent = "未選択";
  else if (n === allValues.length) trigger.textContent = allValues.join("、");
  else trigger.textContent = allValues.filter((v) => selectedSet.has(v)).join("、");
}

// 注文状況のプルダウンが変更されたら、確認ダイアログを出してからSupabaseへ反映する
function wireStatusSelects() {
  document.getElementById("orderListBody").addEventListener("change", async (e) => {
    const judgmentSelect = e.target.closest(".sales-judgment-select");
    if (judgmentSelect) {
      await handleSalesJudgmentChange(judgmentSelect);
      return;
    }

    const select = e.target.closest(".status-select");
    if (!select) return;

    const id = Number(select.dataset.id);
    const newStatus = select.value;
    const previousStatus = select.dataset.prev;

    if (!window.confirm(`現在の注文状況を「${newStatus}」にします。よろしいですか？`)) {
      select.value = previousStatus;
      return;
    }

    select.disabled = true;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/update_order_status`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        },
        body: JSON.stringify({ p_id: id, p_status: newStatus }),
      });
      if (!res.ok) {
        throw new Error(await res.text());
      }

      // 画面上のデータにも反映し、再読み込みなしでグレーアウト表示を更新する
      for (const months of Object.values(ORDER_LIST)) {
        const target = months.find((o) => o["一意キー"] === id);
        if (target) target["注文状況"] = newStatus;
      }
      select.dataset.prev = newStatus;
      const needsNothing = statusStage(newStatus) === 5 || newStatus === "キャンセル済み";
      select.closest("tr").classList.toggle("row-cancelled", needsNothing);
    } catch (err) {
      alert("更新に失敗しました: " + err.message);
      select.value = previousStatus;
    } finally {
      select.disabled = false;
    }
  });
}

// 「注文履歴_表示用」ビューを1000件ずつページ送りして全件取得する
async function fetchAllOrderRows() {
  const pageSize = 1000;
  let from = 0;
  let allRows = [];
  while (true) {
    const { data, error } = await supabaseClient
      .from("注文履歴_表示用")
      .select("*")
      .order("一意キー")
      .range(from, from + pageSize - 1);
    if (error) throw error;
    allRows = allRows.concat(data);
    if (data.length < pageSize) break;
    from += pageSize;
  }
  return allRows;
}

// 「stockdb_リサーチ_表示用」ビューを1000件ずつページ送りして全件取得する
async function fetchAllResearchRows() {
  const pageSize = 1000;
  let from = 0;
  let allRows = [];
  while (true) {
    const { data, error } = await supabaseClient
      .from("stockdb_リサーチ_表示用")
      .select("*")
      .order("JAN")
      .range(from, from + pageSize - 1);
    if (error) throw error;
    allRows = allRows.concat(data);
    if (data.length < pageSize) break;
    from += pageSize;
  }
  return allRows;
}

// 取得した行から、グラフ用の月次集計（取消済みは除外）を組み立てる
function buildMonthlyData(rows) {
  const monthly = {};
  for (const r of rows) {
    if (r["注文状況"] === "取消済み") continue;
    const ym = r["注文日時"] ? r["注文日時"].slice(0, 7) : null;
    if (!ym) continue;
    const site = r["サイト名"];
    monthly[ym] = monthly[ym] || {};
    monthly[ym][site] = monthly[ym][site] || { count: 0, price: 0 };
    monthly[ym][site].count += 1;
    monthly[ym][site].price += Number(r["販売価格"]) || 0;
  }
  const months = Object.keys(monthly).sort();
  const sites = ["Amazon", "メルカリShops"];
  const data = { months };
  for (const site of sites) {
    data[site] = {
      count: months.map((m) => (monthly[m][site] || { count: 0 }).count),
      price: months.map((m) => (monthly[m][site] || { price: 0 }).price),
    };
  }
  return data;
}

// サイト名の表示用ラベル（内部データのキー自体は"Amazon"/"メルカリShops"のまま変更しない）
function siteLabel(name) {
  if (name === "Amazon") return "A";
  if (name === "メルカリShops") return "M";
  return name;
}

// SKUの先頭1文字で仕入先を判定する（aなら自社、bなら取引先、それ以外は他社）
function supplierLabel(sku) {
  if (!sku) return "他社";
  const head = sku.charAt(0);
  if (head === "a") return "自社";
  if (head === "b") return "取引先";
  return "他社";
}

// SKUに埋め込まれた13桁のJANを抜き出す
function extractJan(sku) {
  if (!sku) return null;
  const m = sku.match(/\d{13}/);
  return m ? m[0] : null;
}

// SKUから抜き出したJANで、商品画像の想定パスを返す
// （実際に画像が存在するかはクリック時にimgの読み込み成否で判定する）
function extractJanImagePath(sku) {
  const jan = extractJan(sku);
  return jan ? `images/${jan}.jpg` : null;
}

// 取得した行を、注文リスト表示用に月ごとへ整形する（取消済みも含む）
function buildOrderListByMonth(rows) {
  const byMonth = {};
  for (const r of rows) {
    const ym = r["注文日時"] ? r["注文日時"].slice(0, 7) : null;
    if (!ym) continue;
    (byMonth[ym] = byMonth[ym] || []).push({
      "一意キー": r["一意キー"],
      "サイト名": r["サイト名"],
      "注文番号": r["注文番号"],
      "SKU": r["SKU"],
      "JAN": extractJan(r["SKU"]),
      "数量": r["数量"],
      "商品名": r["商品名"],
      "メーカー名": r["メーカー名"],
      "販売価格": r["販売価格"] != null ? Number(r["販売価格"]) : null,
      "卸値": r["卸値"] != null ? Number(r["卸値"]) : null,
      "配送サイズ": r["配送サイズ"],
      "配送料金": r["配送料金"] != null ? Number(r["配送料金"]) : null,
      "利益": r["利益"] != null ? Number(r["利益"]) : null,
      "在庫数": r["在庫数"] != null ? Number(r["在庫数"]) : null,
      "定価": r["定価"] != null ? Number(r["定価"]) : null,
      "画像": extractJanImagePath(r["SKU"]),
      "注文日時": r["注文日時"],
      "出荷日時": r["出荷日時"],
      "注文状況": r["注文状況"],
      "ランキング": r["ランキング"] != null ? Number(r["ランキング"]) : null,
      "売れ筋判定": r["売れ筋判定"],
    });
  }
  return byMonth;
}

// 取得した行を、リサーチタブ表示用の数値型に整形する（注文とは無関係のstockdb全商品）

  return rows.map((r) => ({
    "JAN": r["JAN"],
    "商品名": r["商品名"],
    "SKU_自社": r["SKU_自社"],
    "SKU_tc": r["SKU_tc"],
    "在庫数": r["在庫数"] != null ? Number(r["在庫数"]) : null,
    "新品_最安値": r["新品_最安値"] != null ? Number(r["新品_最安値"]) : null,
    "ランキング": r["ランキング"] != null ? Number(r["ランキング"]) : null,
    "定価": r["定価"] != null ? Number(r["定価"]) : null,
    "利益": r["利益"] != null ? Number(r["利益"]) : null,
    "配送サイズ": r["配送サイズ"],
    "配送料金": r["配送料金"] != null ? Number(r["配送料金"]) : null,
    "卸値": r["卸値"] != null ? Number(r["卸値"]) : null,
    "メーカー名": r["メーカー名"],
    "在庫数_自社": r["在庫数_自社"] != null ? Number(r["在庫数_自社"]) : 0,
    "在庫数_tc": r["在庫数_tc"] != null ? Number(r["在庫数_tc"]) : 0,
    "ASIN": r["ASIN"],
    "売れ筋判定": r["売れ筋判定"],
    "下限_卸値ver": r["下限_卸値ver"] != null ? Number(r["下限_卸値ver"]) : null,
    "下限_定価ver": r["下限_定価ver"] != null ? Number(r["下限_定価ver"]) : null,
    "新品最低価格": r["新品最低価格"] != null ? Number(r["新品最低価格"]) : null,
    "中古最低価格": r["中古最低価格"] != null ? Number(r["中古最低価格"]) : null,
    "出品者数": r["出品者数"] != null ? Number(r["出品者数"]) : null,

// 在庫数を「合計(内訳: TC X件 / 自社 Y件)」の形で表示する文字列を作る
function stockBreakdownText(o) {
  const total = o["在庫数"] ?? 0;
  return `${total} (内訳: TC ${o["在庫数_tc"] ?? 0}件 / 自社 ${o["在庫数_自社"] ?? 0}件)`;
}


// 「システム状態」テーブルから、GASがGmailを最後にチェックした時刻を取得して表示する
// （新規注文が見つかったかどうかに関わらず記録されている値）
async function renderLastChecked() {
  const el = document.getElementById("lastUpdated");
  try {
    const { data, error } = await supabaseClient
      .from("システム状態")
      .select("更新日時")
      .eq("キー", "Gmail最終チェック")
      .maybeSingle();
    if (error || !data) {
      el.textContent = "";
      return;
    }
    // この値は「システム状態」テーブルのtimestamptz（オフセット付き）を
    // そのまま受け取っているため、注文データ側（オフセット無しのJST文字列）用の
    // formatDateTimeではなく、ここでJST表示に変換する
    const checkedAt = new Date(data["更新日時"]);
    el.textContent = "最終更新日時: " + checkedAt.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" });
  } catch (e) {
    el.textContent = "";
  }
}

// ログイン成功後に呼ばれる: データを取得して画面を組み立てる
async function showDashboard() {
  document.getElementById("loginScreen").hidden = true;
  document.getElementById("dashboardScreen").hidden = false;
  const notice = document.getElementById("loadingNotice");
  notice.hidden = false;
  notice.textContent = "データを読み込み中...";
  try {
    const rows = await fetchAllOrderRows();
    DATA = buildMonthlyData(rows);
    ORDER_LIST = buildOrderListByMonth(rows);

    // 売れ筋判定・利益の再計算は負荷が高いため読み込み時には行わない。
    // リサーチタブの「再取得」ボタン押下時(wireResearchFilterControls内)のみ実行する
    const stockdbRows = await fetchAllResearchRows();
    STOCKDB_LIST = buildStockdbList(stockdbRows);
    notice.hidden = true;

    // GASが「新規注文が来ていないか見に行った」時刻を表示する
    // （新規注文の有無に関わらず、チェックに行くたびに記録されている値）
    await renderLastChecked();

    // 初期表示は期間:月、状況:発送前、判定状況:全て、仕入先:すべて、表示タイプ:注文リスト
    // （filterPeriodKey等の既定値、およびHTML側のチェック済み状態と一致させている）
    renderForSelection();
    renderForSelectionR();
    dashboardLoaded = true;
  } catch (e) {
    notice.hidden = false;
    notice.textContent = "データの読み込みに失敗しました: " + e.message;
    console.error(e);
  }
}

function wireLoginForm() {
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;
    const errorEl = document.getElementById("loginError");
    const submitBtn = document.getElementById("loginSubmit");
    errorEl.hidden = true;
    submitBtn.disabled = true;
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    submitBtn.disabled = false;
    if (error) {
      errorEl.textContent = "ログインできませんでした。メールアドレスまたはパスワードをご確認ください。";
      errorEl.hidden = false;
    }
    // 成功時はonAuthStateChangeがSIGNED_INを検知してshowDashboard()を呼ぶ
  });
}

function wireLogoutButton() {
  document.getElementById("logoutButton").addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
  });
}

// イベント配線は1回だけ行う（ログイン状態・データの有無に関係ない部分）
wireFilterControls();
wireResearchFilterControls();
wireTabButtons();
wireStatusSelects();
wireTruncateClicks();
wireLoginForm();
wireLogoutButton();

// Supabaseクライアントは、他のウィンドウ/タブへ移動して戻ってくるとセッションを
// 再チェックし、SIGNED_INを再度発火させることがある。そのたびにshowDashboard()を
// 呼び直すと「さらに表示」の展開状態がリセットされてしまうため、
// 既に読み込み済みの場合は再読み込みしない
let dashboardLoaded = false;
supabaseClient.auth.onAuthStateChange((event) => {
  if (event === "SIGNED_IN" && !dashboardLoaded) showDashboard();
  if (event === "SIGNED_OUT") {
    dashboardLoaded = false;
    keepaLoaded = false;  // 売れ筋タブも次回ログイン後に読み込み直す
    showLoginScreen();
  }
});

(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    await showDashboard();
  } else {
    showLoginScreen();
  }
})();
