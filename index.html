<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>注文件数・金額ダッシュボード</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* layout: 上部に合計サマリーのタイル、中央に複合グラフ（棒=件数・線=金額）、下に月次テーブル */
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --ink: #1c1b1a;
  --sub: #6b6560;
  --line: #e5e1d8;
  --amazon: #1d4ed8;
  --amazon-soft: #c7d7fb;
  --mercari: #d13a3a;
  --mercari-soft: #f7cfcf;
  --accent-ink: #0f172a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15140f;
    --surface: #1f1d17;
    --ink: #f1efe9;
    --sub: #a89f91;
    --line: #35322a;
    --amazon: #6d9bff;
    --amazon-soft: #253766;
    --mercari: #ff8080;
    --mercari-soft: #5a2222;
    --accent-ink: #f1efe9;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15140f;
  --surface: #1f1d17;
  --ink: #f1efe9;
  --sub: #a89f91;
  --line: #35322a;
  --amazon: #6d9bff;
  --amazon-soft: #253766;
  --mercari: #ff8080;
  --mercari-soft: #5a2222;
  --accent-ink: #f1efe9;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  margin: 0;
  padding-inline: 20px;
  padding-block: 28px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

.login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.login-box {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 32px 28px;
  width: 100%;
  max-width: 340px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.login-box h1 { font-size: 1.2rem; margin: 0; }
.login-box label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.82rem;
  color: var(--sub);
}
.login-box input {
  font-family: inherit;
  font-size: 0.95rem;
  padding: 9px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
}
.login-box button {
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: var(--accent-ink);
  color: var(--bg);
  cursor: pointer;
  margin-top: 6px;
}
.login-error { color: var(--mercari); font-size: 0.82rem; margin: 0; }

.logout-button {
  font-family: inherit;
  font-size: 0.8rem;
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--sub);
  cursor: pointer;
  align-self: flex-start;
  margin-top: 8px;
}

header h1 {
  font-size: 1.5rem;
  font-weight: 700;
  margin: 0 0 4px;
  text-wrap: balance;
}
header p { margin: 0; color: var(--sub); font-size: 0.9rem; }

.summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 14px;
}
.tile {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.tile .label {
  font-size: 0.78rem;
  color: var(--sub);
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  gap: 6px;
}
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot.amazon { background: var(--amazon); }
.dot.mercari { background: var(--mercari); }
.tile .value {
  font-size: 1.5rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--accent-ink);
}
.tile .sub { font-size: 0.8rem; color: var(--sub); font-variant-numeric: tabular-nums; }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
}
.panel h2 {
  font-size: 1rem;
  margin: 0 0 4px;
}
.month-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.month-header h2 { margin: 0; }
#monthSelect {
  font-family: inherit;
  font-size: 0.85rem;
  font-variant-numeric: tabular-nums;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
}
.row-cancelled { opacity: 0.45; }
.status-select {
  font-family: inherit;
  font-size: 0.78rem;
  padding: 4px 6px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
}

.row-clickable { cursor: pointer; }
.row-clickable:hover { background: color-mix(in srgb, var(--accent-ink) 7%, transparent); }
.row-clickable .status-select { cursor: auto; }

.img-btn {
  font-family: inherit;
  font-size: 0.78rem;
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}
.img-btn:hover { background: color-mix(in srgb, var(--accent-ink) 10%, transparent); }

.modal-box-image { max-width: min(90vw, 480px); text-align: center; }
.modal-box-image .modal-scroll { padding: 20px; }
.modal-box-image img { max-width: 100%; max-height: 70vh; border-radius: 8px; min-height: 80px; color: var(--sub); font-size: 0.85rem; }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: color-mix(in srgb, black 45%, transparent);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
}
.modal-box {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  max-width: 480px;
  width: 100%;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 16px 40px color-mix(in srgb, var(--ink) 25%, transparent);
}
.modal-scroll {
  padding: 24px 24px 20px;
  overflow-y: auto;
}
.modal-close {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: none;
  background: var(--surface);
  color: var(--sub);
  font-size: 1.1rem;
  cursor: pointer;
  z-index: 1;
}
.modal-close:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
#modalContent { margin: 0; }
#modalContent dt {
  font-size: 0.78rem;
  color: var(--sub);
  margin-top: 14px;
}
#modalContent dt:first-child { margin-top: 0; }
#modalContent dd {
  margin: 2px 0 0;
  font-size: 0.95rem;
  word-break: break-all;
}
.row-purchased td:not(.cell-flag) { color: var(--sub); }

.toggle-group { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
.toggle-group button {
  font-family: inherit;
  font-size: 0.82rem;
  padding: 6px 14px;
  border: none;
  background: var(--surface);
  color: var(--sub);
  cursor: pointer;
}
.toggle-group button.active {
  background: var(--accent-ink);
  color: var(--bg);
}

.multi-select {
  position: relative;
  display: inline-block;
  margin-bottom: 16px;
}
.multi-select-trigger {
  font-family: inherit;
  font-size: 0.85rem;
  font-variant-numeric: tabular-nums;
  padding: 7px 14px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  min-width: 180px;
  text-align: left;
}
.multi-select-trigger::after { content: " ▾"; color: var(--sub); }
.multi-select-panel {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  z-index: 10;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 8px 24px color-mix(in srgb, var(--ink) 18%, transparent);
  padding: 8px;
  min-width: 200px;
  max-height: 320px;
  overflow-y: auto;
}
.multi-select-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
  font-variant-numeric: tabular-nums;
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap;
}
.multi-select-item:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.multi-select-all {
  font-weight: 600;
  border-bottom: 1px solid var(--line);
  margin-bottom: 4px;
  padding-bottom: 8px;
}
.panel .caption { font-size: 0.82rem; color: var(--sub); margin: 0 0 14px; }

.legend {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  font-size: 0.82rem;
  color: var(--sub);
  margin-top: 10px;
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 14px; height: 14px; border-radius: 3px; }
.swatch.bar-amazon { background: var(--amazon); }
.swatch.bar-mercari { background: var(--mercari); }
.swatch.line-amazon { background: none; border-top: 3px solid var(--amazon); height: 0; width: 16px; }
.swatch.line-mercari { background: none; border-top: 3px solid var(--mercari); height: 0; width: 16px; }

.chart-shell { position: relative; height: 360px; }

table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
thead th { color: var(--sub); font-weight: 600; font-size: 0.78rem; }
tbody tr:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.table-wrap { overflow-x: auto; }
.site-amazon { color: var(--amazon); font-weight: 600; }
.site-mercari { color: var(--mercari); font-weight: 600; }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <form class="login-box" id="loginForm">
    <h1>ログイン</h1>
    <p class="caption">登録済みのメールアドレスでログインしてください。</p>
    <label>
      メールアドレス
      <input type="email" name="email" id="loginEmail" autocomplete="username" required>
    </label>
    <label>
      パスワード
      <input type="password" name="password" id="loginPassword" autocomplete="current-password" required>
    </label>
    <button type="submit" id="loginSubmit">ログイン</button>
    <p class="login-error" id="loginError" hidden></p>
  </form>
</div>

<div class="wrap" id="dashboardScreen" hidden>
  <header>
    <h1>注文件数・金額ダッシュボード</h1>
    <p>Amazon・メルカリShopsの月次注文件数と金額（注文日時基準・JST）</p>
    <button type="button" class="logout-button" id="logoutButton">ログアウト</button>
    <p class="caption" id="lastUpdated"></p>
  </header>
  <p class="caption" id="loadingNotice">データを読み込み中...</p>

  <section class="summary" id="summary"></section>

  <section class="panel">
    <div class="month-header">
      <h2>月次推移</h2>
      <div class="toggle-group" id="modeToggle">
        <button type="button" data-mode="month" class="active">月別</button>
        <button type="button" data-mode="year">年別</button>
      </div>
    </div>
    <div class="toggle-group" id="granularityToggle">
      <button type="button" data-granularity="month" class="active">月分け</button>
      <button type="button" data-granularity="day">日分け</button>
    </div>
    <div class="multi-select" id="periodPicker">
      <button type="button" class="multi-select-trigger" id="periodTrigger">全期間</button>
      <div class="multi-select-panel" id="periodPanel" hidden>
        <label class="multi-select-item multi-select-all">
          <input type="checkbox" id="selectAllCheckbox"> 全選択
        </label>
        <div id="periodItemsList"></div>
      </div>
    </div>
    <p class="caption">棒グラフ=件数（左軸）、折れ線=金額（右軸）</p>
    <div class="chart-shell">
      <canvas id="chart"></canvas>
    </div>
    <div class="legend">
      <span><i class="swatch bar-amazon"></i>Amazon 件数</span>
      <span><i class="swatch bar-mercari"></i>メルカリ 件数</span>
      <span><i class="swatch line-amazon"></i>Amazon 金額</span>
      <span><i class="swatch line-mercari"></i>メルカリ 金額</span>
    </div>
  </section>

  <section class="panel">
    <h2>月次データ</h2>
    <p class="caption" id="monthSummaryCaption"></p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>月</th>
            <th>Amazon 件数</th>
            <th>Amazon 金額</th>
            <th>メルカリ 件数</th>
            <th>メルカリ 金額</th>
          </tr>
        </thead>
        <tbody id="monthSummaryBody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <h2>注文リスト</h2>
    <p class="caption" id="orderListCaption"></p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>状況</th>
            <th>サイト名</th>
            <th>注文番号</th>
            <th>SKU</th>
            <th>数量</th>
            <th>商品名</th>
            <th>販売価格</th>
            <th>卸値</th>
            <th>配送サイズ</th>
            <th>配送料金</th>
            <th>利益</th>
            <th>注文日時</th>
            <th>出荷日時</th>
            <th>商品画像</th>
          </tr>
        </thead>
        <tbody id="orderListBody"></tbody>
      </table>
    </div>
  </section>
</div>

<div class="modal-overlay" id="detailModal" hidden>
  <div class="modal-box">
    <button type="button" class="modal-close" id="modalClose" aria-label="閉じる">×</button>
    <div class="modal-scroll">
      <dl id="modalContent"></dl>
    </div>
  </div>
</div>

<div class="modal-overlay" id="imageModal" hidden>
  <div class="modal-box modal-box-image">
    <button type="button" class="modal-close" id="imageModalClose" aria-label="閉じる">×</button>
    <div class="modal-scroll">
      <img id="imageModalImg" alt="商品画像">
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
// ログイン後にSupabaseの「注文履歴_表示用」ビューから取得したデータを
// ここに入れる（以前はPythonが集計してこのファイルに直接埋め込んでいたが、
// ログインしていない人にもデータが見えてしまうため、埋め込み方式を廃止した）
let DATA = null;
// サイト別・月別の注文明細一覧（キー=YYYY-MM）。卸値はstockdbとJANで紐付け済み
let ORDER_LIST = null;

// 注文状況の更新（update_order_statusというRPC関数しか呼べない権限のanonキー）
const SUPABASE_URL = "https://ragdqeiuiphlhvathrqb.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhZ2RxZWl1aXBobGh2YXRocnFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc1MTE0MzIsImV4cCI6MjA4MzA4NzQzMn0.1X_JNzJspVQ5K6SLpRWxsLLX1NVFeizHX97fSaWo8Bk";

function formatYen(n) {
  return "¥" + Math.round(n).toLocaleString("ja-JP");
}
function formatMonthLabel(ym) {
  const [y, m] = ym.split("-");
  return `${y}/${m}`;
}

function renderSummary() {
  const el = document.getElementById("summary");
  const az = DATA.totals["Amazon"];
  const mc = DATA.totals["メルカリShops"];
  const totalCount = az.count + mc.count;
  const totalPrice = az.price + mc.price;
  el.innerHTML = `
    <div class="tile">
      <div class="label">合計件数</div>
      <div class="value">${totalCount.toLocaleString("ja-JP")} 件</div>
      <div class="sub">${formatYen(totalPrice)}</div>
    </div>
    <div class="tile">
      <div class="label"><span class="dot amazon"></span>Amazon</div>
      <div class="value">${az.count.toLocaleString("ja-JP")} 件</div>
      <div class="sub">${formatYen(az.price)}</div>
    </div>
    <div class="tile">
      <div class="label"><span class="dot mercari"></span>メルカリShops</div>
      <div class="value">${mc.count.toLocaleString("ja-JP")} 件</div>
      <div class="sub">${formatYen(mc.price)}</div>
    </div>
  `;
}

// 先頭5文字だけ表示し、残りは省略記号にする（クリックで全文をポップアップ表示する）
function truncate5(s) {
  if (!s) return "";
  return s.length > 5 ? s.slice(0, 5) + "…" : s;
}

function showDetailModal(o) {
  // 状況は表示のみ（このポップアップ上からは変更できない。変更は一覧のプルダウンから行う）
  document.getElementById("modalContent").innerHTML = `
    <dt>状況</dt><dd>${o["注文状況"] || "未着手"}</dd>
    <dt>サイト名</dt><dd>${o["サイト名"]}</dd>
    <dt>注文番号</dt><dd>${o["注文番号"]}</dd>
    <dt>SKU</dt><dd>${o["SKU"] ?? ""}</dd>
    <dt>数量</dt><dd>${o["数量"] ?? ""}</dd>
    <dt>商品名</dt><dd>${o["商品名"]}</dd>
    <dt>販売価格</dt><dd>${formatYen(o["販売価格"])}</dd>
    <dt>卸値</dt><dd>${o["卸値"] != null ? formatYen(o["卸値"]) : "-"}</dd>
    <dt>配送サイズ</dt><dd>${o["配送サイズ"] ?? "-"}</dd>
    <dt>配送料金</dt><dd>${o["配送料金"] != null ? formatYen(o["配送料金"]) : "-"}</dd>
    <dt>利益</dt><dd>${o["利益"] != null ? formatYen(o["利益"]) : "-"}</dd>
    <dt>注文日時</dt><dd>${formatDateTime(o["注文日時"])}</dd>
    <dt>出荷日時</dt><dd>${formatDateTime(o["出荷日時"])}</dd>
  `;
  document.getElementById("detailModal").hidden = false;
}

function findOrderByUid(id) {
  for (const months of Object.values(ORDER_LIST)) {
    const target = months.find((o) => o["一意キー"] === id);
    if (target) return target;
  }
  return null;
}

function showImageModal(src) {
  const img = document.getElementById("imageModalImg");
  // 画像ファイルが実際には無い場合（JANはあるが画像未登録等）に備えて
  // 読み込み失敗時は代替テキストを表示する
  img.onerror = () => {
    img.onerror = null;
    img.removeAttribute("src");
    img.alt = "この商品の画像は見つかりませんでした";
  };
  img.alt = "商品画像";
  img.src = src;
  document.getElementById("imageModal").hidden = false;
}

function wireTruncateClicks() {
  document.getElementById("orderListBody").addEventListener("click", (e) => {
    // 商品画像ボタンは画像ポップアップだけ開き、詳細ポップアップは開かない
    const imgBtn = e.target.closest(".img-btn");
    if (imgBtn) {
      showImageModal(imgBtn.dataset.img);
      return;
    }
    // 状況プルダウンのクリックはポップアップを開かない
    if (e.target.closest(".status-select")) return;
    const row = e.target.closest(".row-clickable");
    if (!row) return;
    const o = findOrderByUid(Number(row.dataset.id));
    if (o) showDetailModal(o);
  });
  document.getElementById("modalClose").addEventListener("click", () => {
    document.getElementById("detailModal").hidden = true;
  });
  document.getElementById("detailModal").addEventListener("click", (e) => {
    if (e.target.id === "detailModal") {
      document.getElementById("detailModal").hidden = true;
    }
  });
  document.getElementById("imageModalClose").addEventListener("click", () => {
    document.getElementById("imageModal").hidden = true;
  });
  document.getElementById("imageModal").addEventListener("click", (e) => {
    if (e.target.id === "imageModal") {
      document.getElementById("imageModal").hidden = true;
    }
  });
}

function formatDateTime(isoStr) {
  if (!isoStr) return "-";
  const d = new Date(isoStr + "+09:00");
  return d.toLocaleString("ja-JP", {
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit",
  });
}


// 指定した月(複数可)の注文明細を一覧表示する。
// すでに仕入済み・取消済みのものは「仕入が不要」なのでグレーアウトする
const STATUS_OPTIONS = ["未着手", "仕入済み", "出荷済み", "取消済み"];

// 未着手・仕入済み（対応が必要なもの）を優先して上に、
// その中では注文日時が新しい順になるよう並べる
function orderListSortKey(status) {
  return status === "未着手" || status === "仕入済み" || !status ? 0 : 1;
}
function sortOrderRows(list) {
  return list.slice().sort((a, b) => {
    const pa = orderListSortKey(a["注文状況"]);
    const pb = orderListSortKey(b["注文状況"]);
    if (pa !== pb) return pa - pb;
    return (b["注文日時"] || "").localeCompare(a["注文日時"] || "");
  });
}

function renderOrderList(months, label) {
  const tbody = document.getElementById("orderListBody");
  const caption = document.getElementById("orderListCaption");
  const list = sortOrderRows(months.flatMap((ym) => ORDER_LIST[ym] || []));
  caption.textContent = `${label} の注文: ${list.length}件`;

  let rows = "";
  for (const o of list) {
    const status = o["注文状況"] || "未着手";
    const needsNothing = status === "出荷済み" || status === "取消済み";
    const siteClass = o["サイト名"] === "Amazon" ? "site-amazon" : "site-mercari";
    const options = STATUS_OPTIONS
      .map((s) => `<option value="${s}" ${s === status ? "selected" : ""}>${s}</option>`)
      .join("");
    rows += `<tr class="row-clickable ${needsNothing ? "row-cancelled" : ""}" data-id="${o["一意キー"]}">
      <td class="cell-flag"><select class="status-select" data-id="${o["一意キー"]}" data-prev="${status}">${options}</select></td>
      <td class="${siteClass}">${o["サイト名"]}</td>
      <td>${truncate5(o["注文番号"])}</td>
      <td>${truncate5(o["SKU"] ?? "")}</td>
      <td>${o["数量"] ?? ""}</td>
      <td>${truncate5(o["商品名"])}</td>
      <td>${formatYen(o["販売価格"])}</td>
      <td>${o["卸値"] != null ? formatYen(o["卸値"]) : "-"}</td>
      <td>${o["配送サイズ"] ?? "-"}</td>
      <td>${o["配送料金"] != null ? formatYen(o["配送料金"]) : "-"}</td>
      <td>${o["利益"] != null ? formatYen(o["利益"]) : "-"}</td>
      <td>${formatDateTime(o["注文日時"])}</td>
      <td>${formatDateTime(o["出荷日時"])}</td>
      <td>${o["画像"] ? `<button type="button" class="img-btn" data-img="${o["画像"]}">商品画像</button>` : "-"}</td>
    </tr>`;
  }
  tbody.innerHTML = rows || `<tr><td colspan="13">この期間の注文はありません</td></tr>`;
}

function readCssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

// 指定した年の1月〜12月分を、データが無い月は0で埋めて取り出す
function buildYearMonthsData(year) {
  const labels = [];
  const az = { count: [], price: [] };
  const mc = { count: [], price: [] };
  for (let m = 1; m <= 12; m++) {
    const ym = `${year}-${String(m).padStart(2, "0")}`;
    labels.push(`${m}月`);
    const i = DATA.months.indexOf(ym);
    az.count.push(i >= 0 ? DATA["Amazon"].count[i] : 0);
    az.price.push(i >= 0 ? DATA["Amazon"].price[i] : 0);
    mc.count.push(i >= 0 ? DATA["メルカリShops"].count[i] : 0);
    mc.price.push(i >= 0 ? DATA["メルカリShops"].price[i] : 0);
  }
  return { labels, "Amazon": az, "メルカリShops": mc };
}

// 1ヶ月分を日別に分解する（ORDER_LISTの各行の注文日時から日を取り出して集計する）
function buildDailyDataForMonth(ym) {
  const [y, m] = ym.split("-").map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const az = { count: new Array(daysInMonth).fill(0), price: new Array(daysInMonth).fill(0) };
  const mc = { count: new Array(daysInMonth).fill(0), price: new Array(daysInMonth).fill(0) };
  for (const o of ORDER_LIST[ym] || []) {
    if (!o["注文日時"]) continue;
    const day = Number(o["注文日時"].slice(8, 10));
    const target = o["サイト名"] === "Amazon" ? az : mc;
    target.count[day - 1] += 1;
    target.price[day - 1] += o["販売価格"] || 0;
  }
  const labels = Array.from({ length: daysInMonth }, (_, i) => `${y}/${m}/${i + 1}`);
  return { labels, "Amazon": az, "メルカリShops": mc };
}

let chartInstance = null;
let currentMode = "month";
let monthGranularity = "month"; // 月別モード時のみ使う: "month"=月分け, "day"=日分け

// Chart.js本体の描画処理（月別全体表示・年別ズーム表示どちらからも呼ばれる）

    chartInstance.destroy();
  }

  chartInstance = new Chart(ctx, {

      labels: labels,

          label: "Amazon 件数",
          data: azCount,
          backgroundColor: amazonColor,
          yAxisID: "yCount",
          order: 2,
          borderRadius: 3,
          maxBarThickness: barThickness,

        {
          type: "bar",

          data: mcCount,

          yAxisID: "yCount",
          order: 2,
          borderRadius: 3,

          pointRadius: 3,
          borderWidth: 2.5,
        },

          type: "line",
          label: "メルカリ 金額",
          data: mcPrice,
          borderColor: mercariColor,
          backgroundColor: mercariColor,
          yAxisID: "yPrice",
          order: 1,
          tension: 0.3,
          pointRadius: 3,
          borderWidth: 2.5,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (item) => {
              if (item.dataset.yAxisID === "yPrice") {
                return `${item.dataset.label}: ${formatYen(item.parsed.y)}`;
              }
              return `${item.dataset.label}: ${item.parsed.y}件`;

          },

      },

        x: {
          stacked: true,

function getYears() {
  return [...new Set(DATA.months.map((m) => m.split("-")[0]))];
}

// 現在のモードで選べる項目一覧（月別なら全月、年別なら全年）
function allItemsForMode() {
  return currentMode === "year" ? getYears() : DATA.months;
}
// 1項目（月 or 年）が対応する実際の月一覧に展開する
function monthsForItem(item) {
  return currentMode === "year" ? DATA.months.filter((m) => m.startsWith(item)) : [item];
}
function labelForItem(item) {
  return currentMode === "year" ? `${item}年` : formatMonthLabel(item);
}

let selectedSet = new Set();

// 選択されている項目（複数可）をチェックし、全体の推移や個別の比較ができるように
// グラフ・月次データ・注文リストをまとめて再描画する
function renderForSelection() {
  const items = allItemsForMode().filter((i) => selectedSet.has(i));

  // --- グラフ用データを組み立てる（年別は各年12ヶ月分を0埋めして連結） ---
  let labels = [], azCount = [], azPrice = [], mcCount = [], mcPrice = [];
  if (currentMode === "year") {
    for (const y of items) {
      const d = buildYearMonthsData(y);
      labels.push(...d.labels.map((l) => `${y}/${l}`));
      azCount.push(...d["Amazon"].count);
      azPrice.push(...d["Amazon"].price);
      mcCount.push(...d["メルカリShops"].count);
      mcPrice.push(...d["メルカリShops"].price);
    }
  } else if (monthGranularity === "day") {
    // 「日分け」が選択されている場合、選択中の月を注文日時から日別に分解する
    // （複数月選択時は日別に分解したものを連結して比較できるようにする）
    for (const ym of items) {
      const d = buildDailyDataForMonth(ym);
      labels.push(...d.labels);
      azCount.push(...d["Amazon"].count);
      azPrice.push(...d["Amazon"].price);
      mcCount.push(...d["メルカリShops"].count);
      mcPrice.push(...d["メルカリShops"].price);
    }
  } else {
    labels = items.map(formatMonthLabel);
    for (const ym of items) {
      const i = DATA.months.indexOf(ym);
      azCount.push(DATA["Amazon"].count[i]);
      azPrice.push(DATA["Amazon"].price[i]);
      mcCount.push(DATA["メルカリShops"].count[i]);
      mcPrice.push(DATA["メルカリShops"].price[i]);
    }
  }
  const barThickness = currentMode === "year" ? 40 : (currentMode === "month" && monthGranularity === "day" ? 10 : 24);
  renderChartCore(labels, azCount, azPrice, mcCount, mcPrice, barThickness);

  // --- 月次データ: 選択項目ごとに1行ずつ出す ---
  const tbody = document.getElementById("monthSummaryBody");
  const caption = document.getElementById("monthSummaryCaption");
  caption.textContent = items.length ? items.map(labelForItem).join("、") : "未選択";
  let rows = "";
  for (const item of items) {
    let c1 = 0, p1 = 0, c2 = 0, p2 = 0;
    for (const ym of monthsForItem(item)) {
      const i = DATA.months.indexOf(ym);
      if (i < 0) continue;
      c1 += DATA["Amazon"].count[i]; p1 += DATA["Amazon"].price[i];
      c2 += DATA["メルカリShops"].count[i]; p2 += DATA["メルカリShops"].price[i];
    }
    rows += `<tr>
      <td>${labelForItem(item)}</td>
      <td class="site-amazon">${c1}</td>
      <td>${formatYen(p1)}</td>
      <td class="site-mercari">${c2}</td>
      <td>${formatYen(p2)}</td>
    </tr>`;
  }
  tbody.innerHTML = rows || `<tr><td colspan="5">選択してください</td></tr>`;

  // --- 注文リスト: 選択項目に含まれる全月の注文をまとめて出す ---
  const months = items.flatMap(monthsForItem);
  renderOrderList(months, items.map(labelForItem).join("、") || "選択なし");
}

function updateTriggerLabel() {
  const trigger = document.getElementById("periodTrigger");
  const items = allItemsForMode();
  const n = selectedSet.size;
  if (n === 0) trigger.textContent = "未選択";
  else if (n === items.length) trigger.textContent = "全期間";
  else if (n <= 3) trigger.textContent = items.filter((i) => selectedSet.has(i)).map(labelForItem).join("、");
  else trigger.textContent = `${n}件選択中`;
}

function updateSelectAllCheckbox() {
  const all = document.querySelectorAll(".period-checkbox");
  const allChecked = all.length > 0 && Array.from(all).every((cb) => cb.checked);
  document.getElementById("selectAllCheckbox").checked = allChecked;
}

// モード（月別/年別）に応じて選択肢（チェックボックス）一覧を作り直す。
// デフォルトは全選択（＝全体の推移）
function renderPeriodPicker() {
  const items = allItemsForMode();
  selectedSet = new Set(items);

  const list = document.getElementById("periodItemsList");
  list.innerHTML = items
    .map((v) => `
      <label class="multi-select-item">
        <input type="checkbox" class="period-checkbox" value="${v}" checked>
        ${labelForItem(v)}
      </label>
    `)
    .join("");

  list.querySelectorAll(".period-checkbox").forEach((cb) => {
    cb.addEventListener("change", () => {
      if (cb.checked) selectedSet.add(cb.value);
      else selectedSet.delete(cb.value);
      updateSelectAllCheckbox();
      updateTriggerLabel();
      renderForSelection();
    });
  });

  updateSelectAllCheckbox();
  updateTriggerLabel();
  renderForSelection();
}

// 注文状況のプルダウンが変更されたら、確認ダイアログを出してからSupabaseへ反映する
function wireStatusSelects() {
  document.getElementById("orderListBody").addEventListener("change", async (e) => {
    const select = e.target.closest(".status-select");
    if (!select) return;

    const id = Number(select.dataset.id);
    const newStatus = select.value;
    const previousStatus = select.dataset.prev;

    if (!window.confirm(`現在の注文状況を「${newStatus}」にします。よろしいですか？`)) {
      select.value = previousStatus;
      return;
    }

    select.disabled = true;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/update_order_status`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        },
        body: JSON.stringify({ p_id: id, p_status: newStatus }),
      });
      if (!res.ok) {
        throw new Error(await res.text());
      }

      // 画面上のデータにも反映し、再読み込みなしでグレーアウト表示を更新する
      for (const months of Object.values(ORDER_LIST)) {
        const target = months.find((o) => o["一意キー"] === id);
        if (target) target["注文状況"] = newStatus;
      }
      select.dataset.prev = newStatus;
      const needsNothing = ["出荷済み", "取消済み"].includes(newStatus);
      select.closest("tr").classList.toggle("row-cancelled", needsNothing);
    } catch (err) {
      alert("更新に失敗しました: " + err.message);
      select.value = previousStatus;
    } finally {
      select.disabled = false;
    }
  });
}

function wireSelectAllCheckbox() {
  document.getElementById("selectAllCheckbox").addEventListener("change", (e) => {
    const checked = e.target.checked;
    document.querySelectorAll(".period-checkbox").forEach((cb) => {
      cb.checked = checked;
      if (checked) selectedSet.add(cb.value);
      else selectedSet.delete(cb.value);
    });
    updateTriggerLabel();
    renderForSelection();
  });
}

function wireModeToggle() {

function wireGranularityToggle() {

// JSTでの「今月」のYYYY-MMキーを得る（閲覧者のローカル時刻には依存させない）
function getCurrentMonthKeyJST() {
  const fmt = new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit" });
  const parts = fmt.formatToParts(new Date());
  const y = parts.find((p) => p.type === "year").value;
  const m = parts.find((p) => p.type === "month").value;
  return `${y}-${m}`;
}

// ===================================================================
// ログイン認証とデータ取得
// 以前はPythonが30分おきに集計してこのファイルに直接埋め込んでいたが、
// ログインしていない人にもデータが丸見えになってしまうため廃止。
// 今は「ログインしていなければ空の入れ物を表示するだけ」にし、
// ログイン成功後にSupabaseの「注文履歴_表示用」ビュー（authenticated
// ロールのみSELECT可）から直接データを取得する方式に変更した。
// ===================================================================
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function showLoginScreen() {
  document.getElementById("loginScreen").hidden = false;
  document.getElementById("dashboardScreen").hidden = true;
}

// 「注文履歴_表示用」ビューを1000件ずつページ送りして全件取得する
async function fetchAllOrderRows() {
  const pageSize = 1000;
  let from = 0;
  let allRows = [];
  while (true) {
    const { data, error } = await supabaseClient
      .from("注文履歴_表示用")
      .select("*")
      .order("一意キー")
      .range(from, from + pageSize - 1);
    if (error) throw error;
    allRows = allRows.concat(data);
    if (data.length < pageSize) break;
    from += pageSize;
  }
  return allRows;
}

// 取得した行から、グラフ用の月次集計（取消済みは除外）を組み立てる
function buildMonthlyData(rows) {
  const monthly = {};
  for (const r of rows) {
    if (r["注文状況"] === "取消済み") continue;
    const ym = r["注文日時"] ? r["注文日時"].slice(0, 7) : null;
    if (!ym) continue;
    const site = r["サイト名"];
    monthly[ym] = monthly[ym] || {};
    monthly[ym][site] = monthly[ym][site] || { count: 0, price: 0 };
    monthly[ym][site].count += 1;
    monthly[ym][site].price += Number(r["販売価格"]) || 0;
  }
  const months = Object.keys(monthly).sort();
  const sites = ["Amazon", "メルカリShops"];
  const data = { months };
  for (const site of sites) {
    data[site] = {
      count: months.map((m) => (monthly[m][site] || { count: 0 }).count),
      price: months.map((m) => (monthly[m][site] || { price: 0 }).price),
    };
  }
  const totals = {};
  for (const site of sites) {
    totals[site] = {
      count: data[site].count.reduce((a, b) => a + b, 0),
      price: data[site].price.reduce((a, b) => a + b, 0),
    };
  }
  data.totals = totals;
  return data;
}

// SKUから13桁JANを抜き出し、商品画像の想定パスを返す
// （実際に画像が存在するかはクリック時にimgの読み込み成否で判定する）
function extractJanImagePath(sku) {
  if (!sku) return null;
  const m = sku.match(/\d{13}/);
  return m ? `images/${m[0]}.jpg` : null;
}

// 取得した行を、注文リスト表示用に月ごとへ整形する（取消済みも含む）
function buildOrderListByMonth(rows) {
  const byMonth = {};
  for (const r of rows) {
    const ym = r["注文日時"] ? r["注文日時"].slice(0, 7) : null;
    if (!ym) continue;
    (byMonth[ym] = byMonth[ym] || []).push({
      "一意キー": r["一意キー"],
      "サイト名": r["サイト名"],
      "注文番号": r["注文番号"],
      "SKU": r["SKU"],
      "数量": r["数量"],
      "商品名": r["商品名"],
      "販売価格": r["販売価格"] != null ? Number(r["販売価格"]) : null,
      "卸値": r["卸値"] != null ? Number(r["卸値"]) : null,
      "配送サイズ": r["配送サイズ"],
      "配送料金": r["配送料金"] != null ? Number(r["配送料金"]) : null,
      "利益": r["利益"] != null ? Number(r["利益"]) : null,
      "画像": extractJanImagePath(r["SKU"]),
      "注文日時": r["注文日時"],
      "出荷日時": r["出荷日時"],
      "注文状況": r["注文状況"],
    });
  }
  return byMonth;
}

// 「システム状態」テーブルから、GASがGmailを最後にチェックした時刻を取得して表示する
// （新規注文が見つかったかどうかに関わらず記録されている値）
async function renderLastChecked() {
  const el = document.getElementById("lastUpdated");
  try {
    const { data, error } = await supabaseClient
      .from("システム状態")
      .select("更新日時")
      .eq("キー", "Gmail最終チェック")
      .maybeSingle();
    if (error || !data) {
      el.textContent = "";
      return;
    }
    // この値は「システム状態」テーブルのtimestamptz（オフセット付き）を
    // そのまま受け取っているため、注文データ側（オフセット無しのJST文字列）用の
    // formatDateTimeではなく、ここでJST表示に変換する
    const checkedAt = new Date(data["更新日時"]);
    el.textContent = "最終更新日時: " + checkedAt.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" });
  } catch (e) {
    el.textContent = "";
  }
}

// ログイン成功後に呼ばれる: データを取得して画面を組み立てる
async function showDashboard() {
  document.getElementById("loginScreen").hidden = true;
  document.getElementById("dashboardScreen").hidden = false;
  const notice = document.getElementById("loadingNotice");
  notice.hidden = false;
  notice.textContent = "データを読み込み中...";
  try {
    const rows = await fetchAllOrderRows();
    DATA = buildMonthlyData(rows);
    ORDER_LIST = buildOrderListByMonth(rows);
    notice.hidden = true;

    // GASが「新規注文が来ていないか見に行った」時刻を表示する
    // （新規注文の有無に関わらず、チェックに行くたびに記録されている値）
    await renderLastChecked();

    renderSummary();
    renderPeriodPicker();

    // 初期表示は「今月のみを日分けで表示」にする
    monthGranularity = "day";
    document.querySelectorAll("#granularityToggle button").forEach((b) => {
      b.classList.toggle("active", b.dataset.granularity === "day");
    });
    const currentMonth = getCurrentMonthKeyJST();
    if (DATA.months.includes(currentMonth)) {
      selectedSet = new Set([currentMonth]);
      document.querySelectorAll(".period-checkbox").forEach((cb) => {
        cb.checked = cb.value === currentMonth;
      });
      updateSelectAllCheckbox();
      updateTriggerLabel();
      renderForSelection();
    }
  } catch (e) {
    notice.hidden = false;
    notice.textContent = "データの読み込みに失敗しました: " + e.message;
    console.error(e);
  }
}

function wireLoginForm() {
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;
    const errorEl = document.getElementById("loginError");
    const submitBtn = document.getElementById("loginSubmit");
    errorEl.hidden = true;
    submitBtn.disabled = true;
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    submitBtn.disabled = false;
    if (error) {
      errorEl.textContent = "ログインできませんでした。メールアドレスまたはパスワードをご確認ください。";
      errorEl.hidden = false;
    }
    // 成功時はonAuthStateChangeがSIGNED_INを検知してshowDashboard()を呼ぶ
  });
}

function wireLogoutButton() {
  document.getElementById("logoutButton").addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
  });
}

// イベント配線は1回だけ行う（ログイン状態・データの有無に関係ない部分）
wireModeToggle();
wireGranularityToggle();
wireSelectAllCheckbox();
wireStatusSelects();
wireTruncateClicks();
wirePeriodDropdown();
wireLoginForm();
wireLogoutButton();

supabaseClient.auth.onAuthStateChange((event) => {
  if (event === "SIGNED_IN") showDashboard();
  if (event === "SIGNED_OUT") showLoginScreen();
});

(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    await showDashboard();
  } else {
    showLoginScreen();
  }
})();
</script>
</body>
</html>
