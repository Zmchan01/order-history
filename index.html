<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>受注管理表</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* layout: 上部に合計サマリーのタイル、中央に複合グラフ（棒=件数・線=金額）、下に月次テーブル */
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --ink: #1c1b1a;
  --sub: #6b6560;
  --line: #e5e1d8;
  --amazon: #1d4ed8;
  --amazon-soft: #c7d7fb;
  --mercari: #d13a3a;
  --mercari-soft: #f7cfcf;
  --accent-ink: #0f172a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15140f;
    --surface: #1f1d17;
    --ink: #f1efe9;
    --sub: #a89f91;
    --line: #35322a;
    --amazon: #6d9bff;
    --amazon-soft: #253766;
    --mercari: #ff8080;
    --mercari-soft: #5a2222;
    --accent-ink: #f1efe9;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15140f;
  --surface: #1f1d17;
  --ink: #f1efe9;
  --sub: #a89f91;
  --line: #35322a;
  --amazon: #6d9bff;
  --amazon-soft: #253766;
  --mercari: #ff8080;
  --mercari-soft: #5a2222;
  --accent-ink: #f1efe9;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  margin: 0;
  padding-inline: 20px;
  padding-block: 28px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
#orderTabView, #researchTabView { display: flex; flex-direction: column; gap: 4px; }

.login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.login-box {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 32px 28px;
  width: 100%;
  max-width: 340px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.login-box h1 { font-size: 1.2rem; margin: 0; }
.login-box label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.82rem;
  color: var(--sub);
}
.login-box input {
  font-family: inherit;
  font-size: 0.95rem;
  padding: 9px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
}
.login-box button {
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 600;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: var(--accent-ink);
  color: var(--bg);
  cursor: pointer;
  margin-top: 6px;
}
.login-error { color: var(--mercari); font-size: 0.82rem; margin: 0; }

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
}
.header-title-group {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.logout-button {
  font-family: inherit;
  font-size: 0.8rem;
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--sub);
  cursor: pointer;
  flex-shrink: 0;
}

.filter-row {
  display: flex;
  align-items: flex-end;
  gap: 12px;
  flex-wrap: wrap;
}
.filter-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.78rem;
  color: var(--sub);
}
.filter-label { white-space: nowrap; }
.filter-field select,
.filter-field input[type="date"] {
  font-family: inherit;
  font-size: 0.85rem;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}
.custom-range { flex-direction: row; align-items: center; gap: 6px; }
.custom-range span { color: var(--sub); }
.multi-select {
  position: relative;
  display: inline-block;
}
.multi-select-trigger {
  font-family: inherit;
  font-size: 0.85rem;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  min-width: 140px;
  text-align: left;
}
.multi-select-trigger::after { content: " ▾"; color: var(--sub); }
.multi-select-panel {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  z-index: 10;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 8px 24px color-mix(in srgb, var(--ink) 18%, transparent);
  padding: 8px;
  min-width: 160px;
  white-space: nowrap;
}
.multi-select-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
}
.multi-select-item:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }

header h1 {
  font-size: 1.5rem;
  font-weight: 700;
  margin: 0 0 4px;
  text-wrap: balance;
}
header p { margin: 0; color: var(--sub); font-size: 0.9rem; }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
}
.panel h2 {
  font-size: 1rem;
  margin: 0 0 4px;
}
.panel-header {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 4px;
}
.panel-header h2 { margin: 0; }
.panel-header .caption { margin: 0; }
.detail-button {
  font-family: inherit;
  font-size: 0.8rem;
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}
.detail-button:hover { background: color-mix(in srgb, var(--accent-ink) 10%, transparent); }
#orderListMoreButton { display: block; margin: 14px auto 0; }
#monthSelect {
  font-family: inherit;
  font-size: 0.85rem;
  font-variant-numeric: tabular-nums;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
}
.row-cancelled { opacity: 0.45; }
.status-select {
  font-family: inherit;
  font-size: 0.78rem;
  padding: 4px 6px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
}

.row-clickable { cursor: pointer; }
.row-clickable:hover { background: color-mix(in srgb, var(--accent-ink) 7%, transparent); }
.row-clickable .status-select { cursor: auto; }

.modal-product-title {
  margin: 0 0 12px;
  font-size: 1rem;
  font-weight: 700;
  word-break: break-word;
}

.modal-product-image {
  display: block;
  max-width: 100%;
  max-height: 40vh;
  margin: 0 auto 16px;
  border-radius: 8px;
  min-height: 80px;
  color: var(--sub);
  font-size: 0.85rem;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: color-mix(in srgb, black 45%, transparent);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
}
.modal-box {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  max-width: 480px;
  width: 100%;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 16px 40px color-mix(in srgb, var(--ink) 25%, transparent);
}
.modal-box-wide { max-width: 760px; }
.modal-scroll {
  padding: 24px 24px 20px;
  overflow-y: auto;
}
.modal-close {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: none;
  background: var(--surface);
  color: var(--sub);
  font-size: 1.1rem;
  cursor: pointer;
  z-index: 1;
}
.modal-close:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
#modalContent {
  margin: 0;
  display: grid;
  grid-template-columns: auto 1fr;
  column-gap: 10px;
  row-gap: 6px;
  align-items: baseline;
}
#modalContent dt {
  font-size: 0.78rem;
  color: var(--sub);
}
#modalContent dd {
  margin: 0;
  font-size: 0.95rem;
  word-break: break-all;
}
.row-purchased td:not(.cell-flag) { color: var(--sub); }

.panel .caption { font-size: 0.82rem; color: var(--sub); margin: 0 0 14px; }

.legend {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 0.82rem;
  color: var(--sub);
  margin-top: 10px;
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 14px; height: 14px; border-radius: 3px; }
.swatch.bar-amazon { background: var(--amazon-soft); }
.swatch.bar-mercari { background: var(--mercari-soft); }
.swatch.line-amazon { background: none; border-top: 3px solid var(--amazon); height: 0; width: 16px; }
.swatch.line-mercari { background: none; border-top: 3px solid var(--mercari); height: 0; width: 16px; }

.chart-shell { position: relative; height: 360px; }
.modal-chart-shell { position: relative; height: 260px; margin-top: 16px; }

table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
.cell-wrap { text-align: left; white-space: normal; word-break: break-word; max-width: 220px; }
.sub-line { color: var(--sub); font-size: 0.78rem; }
thead th { color: var(--sub); font-weight: 600; font-size: 0.78rem; }
tbody tr:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.table-wrap { overflow-x: auto; }
.order-table { min-width: 660px; }
.order-table thead th { text-align: center; }
/* 売れ筋タブ：カラムが多いため横スクロール＋折り返しなし、見出しと先頭列(ASIN)を固定 */
.keepa-table-wrap { max-height: 75vh; overflow: auto; }
.keepa-table { width: max-content; }
.keepa-table th, .keepa-table td { white-space: nowrap; }
.keepa-table thead th { position: sticky; top: 0; background: var(--surface); z-index: 2; text-align: center; }
.keepa-table th:first-child, .keepa-table td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
.keepa-table thead th:first-child { z-index: 3; }
.keepa-table td.keepa-text { text-align: left; }
.keepa-table td.keepa-long { text-align: left; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
.keepa-pager { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0; font-size: 0.85rem; }
.keepa-pager input { width: 70px; font-family: inherit; font-size: 0.85rem; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
.keepa-pager .detail-button:disabled { opacity: 0.4; cursor: default; }
/* 売れ筋タブのテキスト入力欄（キーワード・小ランキング名） */
.keepa-text-input { font-family: inherit; font-size: 0.85rem; padding: 6px 8px; width: 200px; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
/* 検索ボタンは目立つよう塗りつぶし */
.keepa-search-button { background: var(--amazon); color: #fff; border-color: var(--amazon); font-weight: 600; }
.keepa-search-button:hover { background: color-mix(in srgb, var(--amazon) 85%, #000); }
.site-amazon { color: var(--amazon); font-weight: 600; }
.site-mercari { color: var(--mercari); font-weight: 600; }

.tab-row {
  display: flex;
  gap: 8px;
}
.tab-button {
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  padding: 8px 18px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--sub);
  cursor: pointer;
}
.tab-button.active {
  background: var(--accent-ink);
  color: var(--bg);
  border-color: var(--accent-ink);
}
.sales-flag-ari { color: var(--amazon); font-weight: 600; }
.sales-flag-nashi { color: var(--sub); }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <form class="login-box" id="loginForm">
    <h1>ログイン</h1>
    <p class="caption">登録済みのメールアドレスでログインしてください。</p>
    <label>
      メールアドレス
      <input type="email" name="email" id="loginEmail" autocomplete="username" required>
    </label>
    <label>
      パスワード
      <input type="password" name="password" id="loginPassword" autocomplete="current-password" required>
    </label>
    <button type="submit" id="loginSubmit">ログイン</button>
    <p class="login-error" id="loginError" hidden></p>
  </form>
</div>

<div class="wrap" id="dashboardScreen" hidden>
  <header>
    <div class="header-top">
      <div class="header-title-group">
        <h1>受注管理表</h1>
        <p class="caption" id="lastUpdated"></p>
      </div>
      <button type="button" class="logout-button" id="logoutButton">ログアウト</button>
    </div>
  </header>
  <p class="caption" id="loadingNotice">データを読み込み中...</p>

  <div class="tab-row">
    <button type="button" class="tab-button active" id="orderTabButton">受注管理表</button>
    <button type="button" class="tab-button" id="researchTabButton">リサーチ</button>
    <button type="button" class="tab-button" id="keepaTabButton">売れ筋</button>
  </div>

  <div id="orderTabView">
  <section class="panel" id="filterPanel">
    <div class="filter-row">
      <label class="filter-field">
        <span class="filter-label">期間</span>
        <select id="periodSelect">
          <option value="week">週</option>
          <option value="month" selected>月</option>
          <option value="half_year">半年</option>
          <option value="year">1年</option>
          <option value="h1">上半期</option>
          <option value="h2">下半期</option>
          <option value="all">全て</option>
          <option value="custom">範囲指定</option>
        </select>
      </label>
      <span class="filter-field custom-range" id="customRangeFields" hidden>
        <input type="date" id="customRangeStart">
        <span>〜</span>
        <input type="date" id="customRangeEnd">
      </span>
      <label class="filter-field">
        <span class="filter-label">状況</span>
        <select id="statusFilterSelect">
          <option value="all">全て</option>
          <option value="before_purchase">仕入前</option>
          <option value="before_shipping" selected>発送前</option>
          <option value="shipped">発送済み</option>
          <option value="cancelled">キャンセル済み</option>
        </select>
      </label>
      <div class="filter-field">
        <span class="filter-label">判定状況</span>
        <div class="multi-select" id="judgmentDropdown">
          <button type="button" class="multi-select-trigger" id="judgmentTrigger">全て</button>
          <div class="multi-select-panel" id="judgmentPanel" hidden>
            <label class="multi-select-item"><input type="checkbox" value="売れ筋見込アリ" checked> 見込アリ</label>
            <label class="multi-select-item"><input type="checkbox" value="売れ筋見込ナシ" checked> 見込ナシ</label>
            <label class="multi-select-item"><input type="checkbox" value="売れ筋確定" checked> 確定</label>
          </div>
        </div>
      </div>
      <div class="filter-field">
        <span class="filter-label">仕入先</span>
        <div class="multi-select" id="supplierDropdown">
          <button type="button" class="multi-select-trigger" id="supplierTrigger">自社、取引先、その他</button>
          <div class="multi-select-panel" id="supplierPanel" hidden>
            <label class="multi-select-item"><input type="checkbox" value="自社" checked> 自社</label>
            <label class="multi-select-item"><input type="checkbox" value="取引先" checked> 取引先</label>
            <label class="multi-select-item"><input type="checkbox" value="その他" checked> その他</label>
          </div>
        </div>
      </div>
      <div class="filter-field">
        <span class="filter-label">表示タイプ</span>
        <div class="multi-select" id="displayTypeDropdown">
          <button type="button" class="multi-select-trigger" id="displayTypeTrigger">注文リスト</button>
          <div class="multi-select-panel" id="displayTypePanel" hidden>
            <label class="multi-select-item"><input type="checkbox" value="list" checked> 注文リスト</label>
            <label class="multi-select-item"><input type="checkbox" value="graph"> 注文グラフ</label>
          </div>
        </div>
      </div>
      <button type="button" class="detail-button" id="resetFilterButton">リセット</button>
    </div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>月次データ</h2>
      <p class="caption" id="monthSummaryCaption"></p>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th></th>
            <th>件数</th>
            <th>卸値</th>
            <th>売上</th>
            <th>送料</th>
            <th>利益</th>
          </tr>
        </thead>
        <tbody id="monthSummaryBody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel" id="orderListPanel">
    <div class="panel-header">
      <h2>注文リスト</h2>
      <p class="caption" id="orderListCaption"></p>
    </div>
    <div class="table-wrap">
      <table class="order-table">
        <thead>
          <tr>
            <th>状況</th>
            <th>注文日時/発送日時</th>
            <th>商品名/JAN</th>
            <th>販売価格/卸値</th>
            <th>仕入先/数量</th>
            <th>売れ筋判定</th>
          </tr>
        </thead>
        <tbody id="orderListBody"></tbody>
      </table>
    </div>
    <button type="button" class="detail-button" id="orderListMoreButton" hidden>さらに表示</button>
  </section>

  <section class="panel" id="orderGraphPanel" hidden>
    <div class="panel-header">
      <h2>注文グラフ</h2>
      <p class="caption">棒グラフ(積み上げ)=金額（左軸）、折れ線=件数（右軸）</p>
    </div>
    <div class="chart-shell">
      <canvas id="chart"></canvas>
    </div>
    <div class="legend">
      <span><i class="swatch bar-amazon"></i>Site_A 金額</span>
      <span><i class="swatch bar-mercari"></i>Site_M 金額</span>
      <span><i class="swatch line-amazon"></i>Site_A 件数</span>
      <span><i class="swatch line-mercari"></i>Site_M 件数</span>
    </div>
  </section>
  </div>

  <div id="researchTabView" hidden>
  <section class="panel" id="researchFilterPanel">
    <div class="filter-row">
      <div class="filter-field">
        <span class="filter-label">判定状況</span>
        <div class="multi-select" id="judgmentDropdownR">
          <button type="button" class="multi-select-trigger" id="judgmentTriggerR">見込アリ、確定</button>
          <div class="multi-select-panel" id="judgmentPanelR" hidden>
            <label class="multi-select-item"><input type="checkbox" value="売れ筋見込アリ" checked> 見込アリ</label>
            <label class="multi-select-item"><input type="checkbox" value="売れ筋見込ナシ"> 見込ナシ</label>
            <label class="multi-select-item"><input type="checkbox" value="売れ筋確定" checked> 確定</label>
          </div>
        </div>
      </div>
      <label class="filter-field">
        <span class="filter-label">在庫状況</span>
        <select id="stockFilterSelectR">
          <option value="all">全て</option>
          <option value="in_stock" selected>アリ</option>
          <option value="out_of_stock">ナシ</option>
        </select>
      </label>
      <div class="filter-field">
        <span class="filter-label">仕入先</span>
        <div class="multi-select" id="supplierDropdownR">
          <button type="button" class="multi-select-trigger" id="supplierTriggerR">自社、取引先、その他</button>
          <div class="multi-select-panel" id="supplierPanelR" hidden>
            <label class="multi-select-item"><input type="checkbox" value="自社" checked> 自社</label>
            <label class="multi-select-item"><input type="checkbox" value="取引先" checked> 取引先</label>
            <label class="multi-select-item"><input type="checkbox" value="その他" checked> その他</label>
          </div>
        </div>
      </div>
      <button type="button" class="detail-button" id="refetchJudgmentButtonR">再取得</button>
      <button type="button" class="detail-button" id="resetFilterButtonR">リセット</button>
    </div>
  </section>

  <section class="panel" id="researchListPanel">
    <div class="panel-header">
      <h2>リサーチ</h2>
      <p class="caption" id="researchListCaption"></p>
    </div>
    <div class="table-wrap">
      <table class="order-table">
        <thead>
          <tr>
            <th>商品名/JAN</th>
            <th>ランキング</th>
            <th>売れ筋割合</th>
            <th>売れ筋判定</th>
          </tr>
        </thead>
        <tbody id="researchListBody"></tbody>
      </table>

function formatDateTime(isoStr) {

}

// 状況は5段階（1/5〜5/5）＋キャンセル済み。数字が大きいほど完了に近い
const STATUS_OPTIONS = ["受注のみ", "取り置き依頼済み", "仕入済み", "受渡し前", "受渡し済み", "キャンセル済み"];
const STATUS_STAGE = { "受注のみ": 1, "取り置き依頼済み": 2, "仕入済み": 3, "受渡し前": 4, "受渡し済み": 5 };
function statusStage(status) {
  return STATUS_STAGE[status] || 1;
}

// 「受渡し済み」(5/5、対応完了)・「キャンセル済み」以外を優先して上に、
// その中では注文日時が新しい順になるよう並べる
function orderListSortKey(status) {
  return (statusStage(status) < 5 && status !== "キャンセル済み") ? 0 : 1;
}
function sortOrderRows(list) {
  return list.slice().sort((a, b) => {
    const pa = orderListSortKey(a["注文状況"]);
    const pb = orderListSortKey(b["注文状況"]);
    if (pa !== pb) return pa - pb;
    return (b["注文日時"] || "").localeCompare(a["注文日時"] || "");
  });
}

// 売れ筋割合（新品最安値/定価）を数値で返す。算出できない場合はnull
function salesPriceRatio(o) {
  const price = o["新品_最安値"];
  const list = o["定価"];
  if (price == null || list == null || list === 0) return null;
  return price / list;
}

// ランキングが良い（数字が小さい）順を優先し、同ランキングの場合は
// 売れ筋割合が大きい順に並べる。ランキング無しは末尾にする
function sortResearchRows(list) {
  return list.slice().sort((a, b) => {
    const ra = a["ランキング"], rb = b["ランキング"];
    if (ra == null && rb == null) {
      const pa = salesPriceRatio(a), pb = salesPriceRatio(b);
      if (pa == null && pb == null) return 0;
      if (pa == null) return 1;
      if (pb == null) return -1;
      return pb - pa;
    }
    if (ra == null) return 1;
    if (rb == null) return -1;
    if (ra !== rb) return ra - rb;
    const pa = salesPriceRatio(a), pb = salesPriceRatio(b);
    if (pa == null && pb == null) return 0;
    if (pa == null) return 1;
    if (pb == null) return -1;
    return pb - pa;
  });
}

// 売れ筋割合を小数で表す（1.09、0.89など。高いほど定価に近い＝割引が薄い）
function salesPriceRatioText(o) {
  const ratio = salesPriceRatio(o);
  return ratio == null ? "-" : ratio.toFixed(2);
}

// 日本時間での「YYYY-MM」キーを得る（月バケット集計用）
function monthKeyJST(dateObj) {
  const fmt = new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit" });
  const parts = fmt.formatToParts(dateObj);
  const y = parts.find((p) => p.type === "year").value;
  const m = parts.find((p) => p.type === "month").value;
  return `${y}-${m}`;
}

// リサーチポップアップ内の週次推移グラフ。Amazon情報の1〜12週目シリーズ
// （新品最安値/中古最安値/大ランキング/全出品者数/取得日時）をASINで取得し、
// 直近12ヶ月分の固定の月軸に対応する月へ振り分けて描画する
// （同じ月に複数の週データがある場合は取得日時が新しい方を採用する）
async function renderResearchWeeklyChart(asin, teika) {
  const wrap = document.getElementById("researchChartWrap");
  if (!asin) {
    wrap.hidden = true;
    return;
  }

  const { data, error } = await supabaseClient.rpc("get_weekly_price_history", { p_asin: asin });
  if (error) {
    wrap.hidden = true;
    return;
  }

  // 直近12ヶ月分の固定ラベル（横軸の日付レンジを固定するため、データの有無に関わらず常にこの12ヶ月を表示する）
  const today = getTodayJST();
  const months = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    months.push({ key, label: `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}` });
  }
  const monthKeys = new Set(months.map((m) => m.key));

  if (researchChartInstance) {

// YYYY-MM-DD文字列に変換する
function toDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
// "YYYY-MM-DD"文字列をローカルのDateに変換する（new Date(文字列)はUTC扱いになりずれるため使わない）
function parseDateStr(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
// JSTでの「今日」をDateで得る（閲覧者のローカル時刻には依存させない）
function getTodayJST() {
  const fmt = new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit" });
  const parts = fmt.formatToParts(new Date());
  const y = Number(parts.find((p) => p.type === "year").value);
  const m = Number(parts.find((p) => p.type === "month").value);
  const d = Number(parts.find((p) => p.type === "day").value);
  return new Date(y, m - 1, d);
}

// 「表示する範囲」の各プリセットボタンに対応する日付範囲（両端含む）と、
// グラフを月単位/日単位どちらで分けるかを返す。
// custom指定時の開始/終了日は省略時グローバル（受注管理表タブ）の値を使うが、
// リサーチタブ用に呼ぶ場合はcustomStart/customEndを明示的に渡す
function computeRangeForPreset(key, customStart = customRangeStart, customEnd = customRangeEnd) {
  const today = getTodayJST();
  const y = today.getFullYear();
  if (key === "all") {
    if (!DATA.months.length) return null;
    const [fy, fm] = DATA.months[0].split("-").map(Number);
    const [ly, lm] = DATA.months[DATA.months.length - 1].split("-").map(Number);
    return { start: toDateStr(new Date(fy, fm - 1, 1)), end: toDateStr(new Date(ly, lm, 0)), granularity: "month" };
  }
  if (key === "year") {
    return { start: toDateStr(new Date(y, 0, 1)), end: toDateStr(new Date(y, 11, 31)), granularity: "month" };
  }
  if (key === "h1") {
    return { start: toDateStr(new Date(y, 0, 1)), end: toDateStr(new Date(y, 5, 30)), granularity: "month" };
  }
  if (key === "h2") {
    return { start: toDateStr(new Date(y, 6, 1)), end: toDateStr(new Date(y, 11, 31)), granularity: "month" };
  }
  if (key === "half_year") {
    const start = new Date(today);
    start.setMonth(start.getMonth() - 6);
    return { start: toDateStr(start), end: toDateStr(today), granularity: "month" };
  }
  if (key === "month") {
    return {
      start: toDateStr(new Date(y, today.getMonth(), 1)),
      end: toDateStr(new Date(y, today.getMonth() + 1, 0)),
      granularity: "day",
    };
  }
  if (key === "week") {
    const dow = (today.getDay() + 6) % 7; // 0=月曜 ... 6=日曜
    const monday = new Date(today);
    monday.setDate(monday.getDate() - dow);
    const sunday = new Date(monday);
    sunday.setDate(sunday.getDate() + 6);
    return { start: toDateStr(monday), end: toDateStr(sunday), granularity: "day" };
  }
  if (key === "custom") {
    if (!customStart || !customEnd || customStart > customEnd) return null;
    const days = Math.round((parseDateStr(customEnd) - parseDateStr(customStart)) / 86400000) + 1;
    return { start: customStart, end: customEnd, granularity: days <= 35 ? "day" : "month" };
  }
  return null;
}

// 日付範囲を月ごとのバーに分割する（範囲の最初/最後は月の途中で切れることもある）
function monthBarsForRange(startStr, endStr) {
  const start = parseDateStr(startStr), end = parseDateStr(endStr);
  const items = [];
  let y = start.getFullYear(), m = start.getMonth();
  while (y < end.getFullYear() || (y === end.getFullYear() && m <= end.getMonth())) {
    const monthFirst = new Date(y, m, 1);
    const monthLast = new Date(y, m + 1, 0);
    const rangeStart = monthFirst < start ? start : monthFirst;
    const rangeEnd = monthLast > end ? end : monthLast;
    items.push({
      label: `${y}/${String(m + 1).padStart(2, "0")}`,
      start: toDateStr(rangeStart),
      end: toDateStr(rangeEnd),
    });
    m++;
    if (m > 11) { m = 0; y++; }
  }
  return items;
}

// 日付範囲を1日ごとのバーに分割する
function dayBarsForRange(startStr, endStr) {
  const start = parseDateStr(startStr), end = parseDateStr(endStr);
  const items = [];
  const cursor = new Date(start);
  while (cursor <= end) {
    items.push({ label: `${cursor.getMonth() + 1}/${cursor.getDate()}`, start: toDateStr(cursor), end: toDateStr(cursor) });
    cursor.setDate(cursor.getDate() + 1);
  }
  return items;
}

// 現在選択中の期間から、グラフ用のバー項目一覧を作る
function getDisplayItems() {
  const range = computeRangeForPreset(filterPeriodKey);
  if (!range) return [];
  return range.granularity === "day" ? dayBarsForRange(range.start, range.end) : monthBarsForRange(range.start, range.end);
}

// 指定した日付範囲（YYYY-MM-DD、両端含む）に注文日時が入る注文明細を集める
function ordersInRange(start, end) {
  const result = [];
  for (const ym in ORDER_LIST) {
    for (const o of ORDER_LIST[ym]) {
      const d = (o["注文日時"] || "").slice(0, 10);
      if (d && d >= start && d <= end) result.push(o);
    }
  }
  return result;
}

// ====== フィルター状態（期間・状況・判定状況・仕入先・表示タイプ） ======
let filterPeriodKey = "month";
let filterStatusKey = "before_shipping";
let filterJudgment = new Set(["売れ筋見込アリ", "売れ筋見込ナシ", "売れ筋確定"]);
let filterSuppliers = new Set(["自社", "取引先", "その他"]);
let customRangeStart = "";
let customRangeEnd = "";

// 状況フィルター（全て/仕入前/発送前/発送済み/キャンセル済み）に、
// 注文の状況(1〜5/5、またはキャンセル済み)が合うか判定する（statusKeyを渡す汎用版。リサーチ側とも共用）
function statusMatches(status, statusKey) {
  if (statusKey === "all") return true;
  if (statusKey === "cancelled") return status === "キャンセル済み";
  if (status === "キャンセル済み") return false; // キャンセル済みは仕入前/発送前/発送済みには含めない
  const stage = statusStage(status);
  if (statusKey === "before_purchase") return stage <= 2;
  if (statusKey === "before_shipping") return stage <= 4;
  if (statusKey === "shipped") return stage === 5;
  return true;
}
function statusMatchesFilter(status) {
  return statusMatches(status, filterStatusKey);
}

// 状況フィルター・判定状況フィルター・仕入先フィルターを注文明細配列に適用する
function applyFilters(orders) {
  return orders.filter(
    (o) =>
      statusMatchesFilter(o["注文状況"] || "受注のみ") &&
      judgmentMatchesFilter(o["売れ筋判定"], filterJudgment) &&
      filterSuppliers.has(supplierLabel(o["SKU"]))
  );
}

// ====== リサーチタブ用のフィルター状態（判定状況・在庫状況・仕入先） ======
// リサーチタブはstockdb全商品ベース（注文とは無関係）のため、注文日時・注文状況が無く
// 「期間」「状況（注文の状況）」フィルターは成り立たない。代わりに在庫状況で絞り込む
let filterStockKeyR = "in_stock";
let filterJudgmentR = new Set(["売れ筋見込アリ", "売れ筋確定"]);
let filterSuppliersR = new Set(["自社", "取引先", "その他"]);

// stockdb.売れ筋判定カラムの値（日次バッチ・再取得ボタンが書き込む）。プルダウンの選択肢
const SALES_JUDGMENT_OPTIONS = ["売れ筋見込アリ", "売れ筋見込ナシ", "売れ筋確定"];

// 判定状況フィルターの判定。judgmentがnull（まだ自動判定を通っていない商品）は、
// 絞り込みをしていない状態（3つ全部選択中）の時だけ表示対象に含める
function judgmentMatchesFilter(judgment, selectedSet) {
  if (judgment == null) return selectedSet.size === SALES_JUDGMENT_OPTIONS.length;
  return selectedSet.has(judgment);
}

// 判定状況プルダウンのトリガー表示文字列を組み立てる（短い表記に変換する）
const SALES_JUDGMENT_SHORT_LABELS = { "売れ筋見込アリ": "見込アリ", "売れ筋見込ナシ": "見込ナシ", "売れ筋確定": "確定" };
function updateJudgmentTriggerLabel(triggerId, selectedSet) {
  const trigger = document.getElementById(triggerId);
  if (selectedSet.size === 0) trigger.textContent = "未選択";
  else if (selectedSet.size === SALES_JUDGMENT_OPTIONS.length) trigger.textContent = "全て";
  else {
    trigger.textContent = SALES_JUDGMENT_OPTIONS
      .filter((v) => selectedSet.has(v))
      .map((v) => SALES_JUDGMENT_SHORT_LABELS[v])
      .join("、");
  }
}

// 売れ筋判定プルダウンのHTML片を作る。DB未反映(null)の場合は「売れ筋見込アリ」を仮表示する
function salesJudgmentSelectHtml(jan, currentValue) {
  const value = SALES_JUDGMENT_OPTIONS.includes(currentValue) ? currentValue : "売れ筋見込アリ";
  const options = SALES_JUDGMENT_OPTIONS
    .map((v) => `<option value="${v}" ${v === value ? "selected" : ""}>${v}</option>`)
    .join("");
  return `<select class="status-select sales-judgment-select" data-jan="${jan ?? ""}" data-prev="${value}">${options}</select>`;
}

// 指定RPCを呼び、成功したら画面上の該当JANの表示値も更新する（同じJANを持つ全ての行）
async function callSalesJudgmentRpc(select, rpcName, jan, displayValueOnSuccess) {
  const previousValue = select.dataset.prev;
  select.disabled = true;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${rpcName}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      },
      body: JSON.stringify({ p_jan: jan }),
    });
    if (!res.ok) {
      throw new Error(await res.text());
    }

    for (const months of Object.values(ORDER_LIST)) {
      for (const o of months) {
        if (o["JAN"] === jan) o["売れ筋判定"] = displayValueOnSuccess;
      }
    }
    for (const o of STOCKDB_LIST || []) {
      if (o["JAN"] === jan) o["売れ筋判定"] = displayValueOnSuccess;
    }
    select.dataset.prev = displayValueOnSuccess;
    select.value = displayValueOnSuccess;
  } catch (err) {
    alert("更新に失敗しました: " + err.message);
    select.value = previousValue;
  } finally {
    select.disabled = false;
  }
}

// 売れ筋判定プルダウンの変更を処理する。
// 「売れ筋確定」への変更はDBに書き込む。確定済みから見込アリ/ナシへ変更した場合は
// 確定を解除する（解除後の正式な判定値は次回の日次自動判定で確定する。選んだ値は
// 解除までの仮表示）。確定でない状態での見込アリ⇔見込ナシの変更は手動では行えない
// （自動判定のみが管理するため）
async function handleSalesJudgmentChange(select) {
  const jan = select.dataset.jan;
  const newValue = select.value;
  const previousValue = select.dataset.prev;
  if (newValue === previousValue) return;

  if (!jan) {
    alert("JANが取得できないため変更できません");
    select.value = previousValue;
    return;
  }

  if (newValue === "売れ筋確定") {
    if (!window.confirm("この商品を「売れ筋確定」にします。よろしいですか？")) {
      select.value = previousValue;
      return;
    }
    await callSalesJudgmentRpc(select, "confirm_sales_judgment", jan, "売れ筋確定");
    return;
  }

  if (previousValue === "売れ筋確定") {
    if (!window.confirm("「売れ筋確定」を解除します。よろしいですか？（正式な判定値は次回の自動判定で確定します）")) {
      select.value = previousValue;
      return;
    }
    await callSalesJudgmentRpc(select, "unconfirm_sales_judgment", jan, newValue);
    return;
  }

  // 確定していない状態での見込アリ⇔見込ナシの変更はDBに反映しない
  select.value = previousValue;
}

// stockdbの商品行（SKU_自社/SKU_tcの有無）から、該当する仕入先ラベルの集合を返す
// （1商品が自社・取引先どちらにも出品されている場合は両方に属する）
function productSupplierLabels(o) {
  const labels = [];
  if (o["SKU_自社"]) labels.push("自社");
  if (o["SKU_tc"]) labels.push("取引先");
  if (labels.length === 0) labels.push("その他");
  return labels;
}

// 在庫状況フィルター（全て/アリ/ナシ）に、商品の在庫数が合うか判定する
function stockMatchesFilter(stock) {
  if (filterStockKeyR === "all") return true;
  if (filterStockKeyR === "in_stock") return (stock || 0) > 0;
  if (filterStockKeyR === "out_of_stock") return !stock || stock <= 0;
  return true;
}

// リサーチタブの判定状況・在庫状況・仕入先フィルターを商品明細配列に適用する
function applyFiltersR(products) {
  return products.filter((o) => {
    if (!judgmentMatchesFilter(o["売れ筋判定"], filterJudgmentR)) return false;
    if (!stockMatchesFilter(o["在庫数"])) return false;
    if (!productSupplierLabels(o).some((l) => filterSuppliersR.has(l))) return false;
    return true;
  });
}

// 注文明細配列から、サイト別の件数・金額を集計する
function siteTotals(orders) {
  let c1 = 0, p1 = 0, c2 = 0, p2 = 0;
  for (const o of orders) {
    if (o["サイト名"] === "Amazon") { c1 += 1; p1 += o["販売価格"] || 0; }
    else { c2 += 1; p2 += o["販売価格"] || 0; }
  }
  return { c1, p1, c2, p2 };
}

// 注文明細配列から、件数・卸値・売上・送料・利益の合計を算出する（月次データ用）
function sumMetrics(orders) {
  let count = 0, wholesale = 0, sales = 0, shipping = 0, profit = 0;
  for (const o of orders) {
    count += 1;
    wholesale += o["卸値"] || 0;
    sales += o["販売価格"] || 0;
    shipping += o["配送料金"] || 0;
    profit += o["利益"] || 0;
  }
  return { count, wholesale, sales, shipping, profit };
}

// 選択されている期間・状況・仕入先のフィルターに応じて、
// 月次データ・注文リスト・注文グラフをまとめて再描画する
function renderForSelection() {
  const range = computeRangeForPreset(filterPeriodKey);
  const items = getDisplayItems();
  const periodOrders = applyFilters(range ? ordersInRange(range.start, range.end) : []);

  // --- 注文グラフ用データを組み立てる（期間を月または日に分けてバーにする） ---
  const labels = items.map((item) => item.label);
  const azCount = [], azPrice = [], mcCount = [], mcPrice = [];
  for (const item of items) {
    const t = siteTotals(applyFilters(ordersInRange(item.start, item.end)));
    azCount.push(t.c1); azPrice.push(t.p1);
    mcCount.push(t.c2); mcPrice.push(t.p2);
  }
  renderChartCore(labels, azCount, azPrice, mcCount, mcPrice);

  // --- 月次データ: サイト別(A/M)と合計の3行で、件数・卸値・売上・送料・利益を出す ---
  const tbody = document.getElementById("monthSummaryBody");
  const caption = document.getElementById("monthSummaryCaption");
  caption.textContent = range ? `${range.start} 〜 ${range.end}` : "未選択";
  let rows = "";
  if (range) {
    const azOrders = periodOrders.filter((o) => o["サイト名"] === "Amazon");
    const mcOrders = periodOrders.filter((o) => o["サイト名"] !== "Amazon");
    const rowDefs = [
      ["A", "site-amazon", sumMetrics(azOrders)],
      ["M", "site-mercari", sumMetrics(mcOrders)],
      ["合計", "", sumMetrics(periodOrders)],
    ];
    rows = rowDefs.map(([label, cls, m]) => `<tr>
      <td class="${cls}">${label}</td>
      <td>${m.count.toLocaleString("ja-JP")}件</td>
      <td>${formatYen(m.wholesale)}</td>
      <td>${formatYen(m.sales)}</td>
      <td>${formatYen(m.shipping)}</td>
      <td>${formatYen(m.profit)}</td>
    </tr>`).join("");
  }
  tbody.innerHTML = rows || `<tr><td colspan="6">選択してください</td></tr>`;

  // --- 注文リスト: 選択範囲・フィルターに含まれる注文をまとめて出す ---
  renderOrderList(periodOrders, range ? `${range.start} 〜 ${range.end}` : "選択なし");
}

// リサーチタブ: 選択されている判定状況・在庫状況・仕入先フィルターに応じてリサーチリストを再描画する
// （stockdb全商品ベースのため、注文のような期間絞り込みは行わない）
function renderForSelectionR() {
  const filtered = applyFiltersR(STOCKDB_LIST || []);
  renderResearchList(filtered, "stockdb全商品");
}

// 期間・状況・判定状況・仕入先・表示タイプ・リセットの各コントロールを配線する
function wireFilterControls() {
  document.getElementById("periodSelect").addEventListener("change", (e) => {
    filterPeriodKey = e.target.value;
    document.getElementById("customRangeFields").hidden = filterPeriodKey !== "custom";
    renderForSelection();
  });
  document.getElementById("customRangeStart").addEventListener("change", (e) => {
    customRangeStart = e.target.value;
    renderForSelection();
  });
  document.getElementById("customRangeEnd").addEventListener("change", (e) => {
    customRangeEnd = e.target.value;
    renderForSelection();
  });
  document.getElementById("statusFilterSelect").addEventListener("change", (e) => {
    filterStatusKey = e.target.value;
    renderForSelection();
  });

  wireCheckboxDropdown({
    dropdownId: "judgmentDropdown", triggerId: "judgmentTrigger", panelId: "judgmentPanel",
    onChange: (checked) => {
      filterJudgment = checked;
      updateJudgmentTriggerLabel("judgmentTrigger", filterJudgment);
      renderForSelection();
    },
  });
  wireCheckboxDropdown({
    dropdownId: "supplierDropdown", triggerId: "supplierTrigger", panelId: "supplierPanel",
    onChange: (checked) => {
      filterSuppliers = checked;
      updateSupplierTriggerLabel();
      renderForSelection();
    },
  });
  wireCheckboxDropdown({
    dropdownId: "displayTypeDropdown", triggerId: "displayTypeTrigger", panelId: "displayTypePanel",
    onChange: (checked) => {
      updateDisplayTypeTriggerLabel(checked);
      document.getElementById("orderListPanel").hidden = !checked.has("list");

  wireCheckboxDropdown({

      renderForSelectionR();
    },
  });
  document.getElementById("resetFilterButtonR").addEventListener("click", () => {

    filterSuppliersR = new Set(["自社", "取引先", "その他"]);

    document.querySelectorAll("#judgmentPanelR input").forEach((cb) => { cb.checked = cb.value !== "売れ筋見込ナシ"; });
    document.querySelectorAll("#supplierPanelR input").forEach((cb) => { cb.checked = true; });
    updateJudgmentTriggerLabel("judgmentTriggerR", filterJudgmentR);
    updateTriggerLabel("supplierTriggerR", filterSuppliersR, ["自社", "取引先", "その他"]);
    renderForSelectionR();
  });

  document.getElementById("refetchJudgmentButtonR").addEventListener("click", async (e) => {
    const button = e.currentTarget;
    if (!window.confirm("売れ筋判定を今すぐ再取得します。よろしいですか？（確定済みの商品は変更されません）")) return;

    button.disabled = true;
    const originalText = button.textContent;
    button.textContent = "再取得中…";
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/run_sales_judgment`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        },
        body: "{}",
      });
      if (!res.ok) {
        throw new Error(await res.text());
      }
      const updatedCount = await res.json();

      STOCKDB_LIST = buildStockdbList(await fetchAllResearchRows());
      renderForSelectionR();
      alert(`売れ筋判定を再取得しました（更新件数: ${updatedCount}件）`);
    } catch (err) {
      alert("再取得に失敗しました: " + err.message);
    } finally {
      button.disabled = false;
      button.textContent = originalText;
    }
  });
}

// 検索ボタンを押した時点の絞り込み条件（id→選択値）。ページ送りもこの条件で取得する
// （プルダウンを変えただけでは通信しない。検索ボタンでまとめて1回だけ取得する）
let keepaAppliedFilters = {};

// 絞り込みプルダウンと検索・リセットボタンを描画する
function renderKeepaFilters() {
  const row = document.getElementById("keepaFilterRow");
  let html = "";
  for (const f of KEEPA_FILTERS) {
    // テキスト入力の項目（キーワード・小ランキング名）は入力欄、それ以外はプルダウン
    if (f.type === "text") {
      html += `<label class="filter-field"><span class="filter-label">${escapeKeepa(f.label)}</span>` +
        `<input type="text" class="keepa-text-input" id="${f.id}" placeholder="${escapeKeepa(f.placeholder || "")}"></label>`;
      continue;
    }
    const select = `<select id="${f.id}">${f.options
      .map(([v, t]) => `<option value="${escapeKeepa(v)}">${escapeKeepa(t)}</option>`).join("")}</select>`;
    if (f.range === "start") {
      // 範囲指定の下限側：ラベルと下限・上限のプルダウンを1つの枠にまとめる
      html += `<div class="filter-field"><span class="filter-label">${escapeKeepa(f.label)}</span>${select}`;
    } else if (f.range === "end") {
      html += `<span>〜</span>${select}</div>`;
    } else {
      html += `<label class="filter-field"><span class="filter-label">${escapeKeepa(f.label)}</span>${select}</label>`;
    }
  }
  // 並び替え・表示件数（絞り込み条件ではないため KEEPA_FILTERS とは別に置く）
  html += `<label class="filter-field"><span class="filter-label">並び替え</span><select id="kfSort">${KEEPA_SORTS
    .map(([v, t]) => `<option value="${v}"${v === keepaSort ? " selected" : ""}>${escapeKeepa(t)}</option>`).join("")}</select></label>`;
  html += `<label class="filter-field"><span class="filter-label">表示件数</span><select id="kfPageSize">${KEEPA_PAGE_SIZES
    .map((n) => `<option value="${n}"${n === keepaPageSize ? " selected" : ""}>${n}件</option>`).join("")}</select></label>`;
  html += `<button type="button" class="detail-button keepa-search-button" id="kfSearch">検索</button>`;
  html += `<button type="button" class="detail-button" id="kfReset">リセット</button>`;
  row.innerHTML = html;
  // 検索：今のプルダウン・入力欄の値を条件として確定し、1ページ目から取得する
  const runSearch = () => {
    keepaAppliedFilters = {};
    for (const f of KEEPA_FILTERS) {
      const v = document.getElementById(f.id).value.trim();
      keepaAppliedFilters[f.id] = v === "" ? "all" : v;
    }
    keepaSort = document.getElementById("kfSort").value;
    keepaPageSize = Number(document.getElementById("kfPageSize").value);
    loadKeepaPage(1);
  };
  document.getElementById("kfSearch").addEventListener("click", runSearch);
  // 入力欄でEnterを押したときも検索する
  row.querySelectorAll(".keepa-text-input").forEach((el) => {
    el.addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });
  });
  // リセット：プルダウンを「全て」、入力欄を空、並び替えを初期、表示件数を30件に戻すだけ
  // （通信はしない。検索ボタンで反映）
  document.getElementById("kfReset").addEventListener("click", () => {
    for (const f of KEEPA_FILTERS) document.getElementById(f.id).value = f.type === "text" ? "" : "all";
    document.getElementById("kfSort").value = "score";
    document.getElementById("kfPageSize").value = String(KEEPA_DEFAULT_PAGE_SIZE);
  });
}

// 検索ボタンで確定した絞り込み条件をSupabaseのクエリに付ける
function applyKeepaFilters(q) {
  const orGroups = [];
  for (const f of KEEPA_FILTERS) {
    const v = keepaAppliedFilters[f.id] || "all";
    q = f.apply(q, v);
    const o = f.ors ? f.ors(v) : null;
    if (o) orGroups.push(o);
  }
  // OR条件が複数あるときは and(or(...),or(...)) の形にまとめて1つにする
  if (orGroups.length === 1) q = q.or(orGroups[0]);
  else if (orGroups.length > 1) q = q.or(`and(${orGroups.map((g) => `or(${g})`).join(",")})`);
  return q;
}

// 指定ページの100件と総件数をSupabaseから取得して表示する
async function loadKeepaPage(page) {
  const caption = document.getElementById("keepaListCaption");
  caption.textContent = "読み込み中...";
  // 初回だけ絞り込みプルダウンを描画する
  if (!document.getElementById("kfStock")) renderKeepaFilters();
  const from = (page - 1) * keepaPageSize;
  try {
    let q = supabaseClient
      .from("keepa情報")
      .select(KEEPA_COLUMNS.join(","), { count: "exact" });
    q = applyKeepaFilters(q);
    // 検索ボタンで確定した並び替え（空欄は常に最後。同じ値どうしはASIN順）
    const [, sortLabel, sortCol, sortAsc] = KEEPA_SORTS.find((s) => s[0] === keepaSort) || KEEPA_SORTS[0];
    const { data, count, error } = await q
      .order(sortCol, { ascending: sortAsc, nullsFirst: false })
      .order("ASIN")
      .range(from, from + keepaPageSize - 1);
    if (error) throw error;
    keepaPage = page;
    keepaTotal = count ?? 0;
    keepaLoaded = true;
    renderKeepaTable(data);
    renderKeepaPagers();
    const shownTo = from + data.length;
    caption.textContent = keepaTotal
      ? `全${keepaTotal.toLocaleString()}件中 ${(from + 1).toLocaleString()}〜${shownTo.toLocaleString()}件目（${sortLabel}）`
      : "データがありません";
  } catch (e) {
    caption.textContent = "読み込みに失敗しました: " + e.message;
    console.error(e);
  }
}

// 1セル分の表示文字列を作る（数値は3桁区切り、日時は日本時間、空欄は空文字）
function keepaCellText(col, v) {
  if (v == null || v === "") return "";
  // 値崩れなし・定価超え（true/false）は、当てはまるときだけ「○」を出す
  if (typeof v === "boolean") return v ? "○" : "";
  // 発売日は「2024-03-15」で届くので「2024/03/15」に整える
  if (col === "発売日") return String(v).replace(/-/g, "/");
  if (KEEPA_DATE_COLUMNS.has(col)) return new Date(v).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" });
  if (typeof v === "number") return v.toLocaleString();
  return String(v);
}

// 見出し行と100件分の行を描画する
function renderKeepaTable(rows) {
  const head = document.getElementById("keepaHeadRow");
  if (!head.children.length) {
    head.innerHTML = KEEPA_DISPLAY_COLUMNS.map((c) => `<th>${escapeKeepa(c)}</th>`).join("");
  }
  document.getElementById("keepaListBody").innerHTML = rows.map((r) => {
    const tds = KEEPA_DISPLAY_COLUMNS.map((c) => {
      const text = escapeKeepa(keepaCellText(c, keepaValue(r, c)));
      const cls = KEEPA_LONG_COLUMNS.has(c) ? "keepa-long" : KEEPA_TEXT_COLUMNS.has(c) ? "keepa-text" : "";
      // 省略表示されるセルは、マウスを乗せると全文が出るようtitleを付ける
      const title = KEEPA_LONG_COLUMNS.has(c) && text ? ` title="${text}"` : "";
      // ASINはAmazonの商品ページへのリンクにする（新しいタブで開く）
      if (c === "ASIN" && text) {
        const href = `https://www.amazon.co.jp/dp/${encodeURIComponent(r["ASIN"])}`;
        return `<td class="${cls}"><a href="${href}" target="_blank" rel="noopener noreferrer">${text}</a></td>`;
      }
      return `<td class="${cls}"${title}>${text}</td>`;
    }).join("");
    return `<tr>${tds}</tr>`;
  }).join("");
  // ページを切り替えたら表の先頭に戻す
  document.querySelector(".keepa-table-wrap").scrollTop = 0;
}

// HTMLとして解釈されないよう文字を置き換える
function escapeKeepa(s) {
  return String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

// 表の上下にページ送り（最初・前へ・ページ番号入力・次へ・最後）を描画する
function renderKeepaPagers() {
  // 最終ページ番号＝総件数÷選択中の表示件数（切り上げ）
  const last = Math.max(1, Math.ceil(keepaTotal / keepaPageSize));
  for (const id of ["keepaPagerTop", "keepaPagerBottom"]) {
    const el = document.getElementById(id);
    el.innerHTML = `
      <button type="button" class="detail-button" data-go="1" ${keepaPage <= 1 ? "disabled" : ""}>最初</button>
      <button type="button" class="detail-button" data-go="${keepaPage - 1}" ${keepaPage <= 1 ? "disabled" : ""}>前へ</button>
      <span><input type="number" min="1" max="${last}" value="${keepaPage}"> / ${last.toLocaleString()} ページ</span>
      <button type="button" class="detail-button" data-go="${keepaPage + 1}" ${keepaPage >= last ? "disabled" : ""}>次へ</button>
      <button type="button" class="detail-button" data-go="${last}" ${keepaPage >= last ? "disabled" : ""}>最後</button>`;
    el.querySelectorAll("button[data-go]").forEach((b) => {
      b.addEventListener("click", () => loadKeepaPage(Number(b.dataset.go)));
    });
    // ページ番号を入力してEnterでそのページへ移動（範囲外は最初/最後に丸める）
    el.querySelector("input").addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const p = Math.min(last, Math.max(1, parseInt(e.target.value, 10) || 1));
      loadKeepaPage(p);
    });
  }
}

// チェックボックス付きプルダウン（仕入先・表示タイプ共通）の開閉とチェック変更を配線する
function wireCheckboxDropdown({ dropdownId, triggerId, panelId, onChange }) {
  const dropdown = document.getElementById(dropdownId);
  const trigger = document.getElementById(triggerId);
  const panel = document.getElementById(panelId);
  trigger.addEventListener("click", () => {
    panel.hidden = !panel.hidden;
  });
  document.addEventListener("click", (e) => {
    if (!dropdown.contains(e.target)) panel.hidden = true;
  });
  panel.addEventListener("change", () => {
    const checked = new Set(
      Array.from(panel.querySelectorAll("input:checked")).map((cb) => cb.value)
    );
    onChange(checked);
  });
}

// 注文状況のプルダウンが変更されたら、確認ダイアログを出してからSupabaseへ反映する
function wireStatusSelects() {
  document.getElementById("orderListBody").addEventListener("change", async (e) => {
    const judgmentSelect = e.target.closest(".sales-judgment-select");
    if (judgmentSelect) {
      await handleSalesJudgmentChange(judgmentSelect);
      return;
    }

    const select = e.target.closest(".status-select");
    if (!select) return;

    const id = Number(select.dataset.id);
    const newStatus = select.value;
    const previousStatus = select.dataset.prev;

    if (!window.confirm(`現在の注文状況を「${newStatus}」にします。よろしいですか？`)) {
      select.value = previousStatus;
      return;
    }

    select.disabled = true;
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/update_order_status`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        },
        body: JSON.stringify({ p_id: id, p_status: newStatus }),
      });
      if (!res.ok) {
        throw new Error(await res.text());
      }

      // 画面上のデータにも反映し、再読み込みなしでグレーアウト表示を更新する
      for (const months of Object.values(ORDER_LIST)) {
        const target = months.find((o) => o["一意キー"] === id);
        if (target) target["注文状況"] = newStatus;
      }
      select.dataset.prev = newStatus;
      const needsNothing = statusStage(newStatus) === 5 || newStatus === "キャンセル済み";
      select.closest("tr").classList.toggle("row-cancelled", needsNothing);
    } catch (err) {
      alert("更新に失敗しました: " + err.message);
      select.value = previousStatus;
    } finally {
      select.disabled = false;
    }
  });
}

// 取得した行から、グラフ用の月次集計（取消済みは除外）を組み立てる
function buildMonthlyData(rows) {
  const monthly = {};
  for (const r of rows) {
    if (r["注文状況"] === "取消済み") continue;
    const ym = r["注文日時"] ? r["注文日時"].slice(0, 7) : null;
    if (!ym) continue;
    const site = r["サイト名"];
    monthly[ym] = monthly[ym] || {};
    monthly[ym][site] = monthly[ym][site] || { count: 0, price: 0 };
    monthly[ym][site].count += 1;
    monthly[ym][site].price += Number(r["販売価格"]) || 0;
  }
  const months = Object.keys(monthly).sort();
  const sites = ["Amazon", "メルカリShops"];
  const data = { months };
  for (const site of sites) {
    data[site] = {
      count: months.map((m) => (monthly[m][site] || { count: 0 }).count),
      price: months.map((m) => (monthly[m][site] || { price: 0 }).price),
    };
  }
  return data;
}

// サイト名の表示用ラベル（内部データのキー自体は"Amazon"/"メルカリShops"のまま変更しない）
function siteLabel(name) {

  if (name === "メルカリShops") return "M";
  return name;
}

// SKUの先頭1文字で仕入先を判定する（aなら自社、bなら取引先、それ以外は他社）
function supplierLabel(sku) {
  if (!sku) return "他社";
  const head = sku.charAt(0);
  if (head === "a") return "自社";
  if (head === "b") return "取引先";
  return "他社";
}

// SKUに埋め込まれた13桁のJANを抜き出す
function extractJan(sku) {
  if (!sku) return null;
  const m = sku.match(/\d{13}/);
  return m ? m[0] : null;
}

// SKUから抜き出したJANで、商品画像の想定パスを返す

function extractJanImagePath(sku) {

}

// 「システム状態」テーブルから、GASがGmailを最後にチェックした時刻を取得して表示する
// （新規注文が見つかったかどうかに関わらず記録されている値）
async function renderLastChecked() {
  const el = document.getElementById("lastUpdated");
  try {
    const { data, error } = await supabaseClient
      .from("システム状態")
      .select("更新日時")
      .eq("キー", "Gmail最終チェック")
      .maybeSingle();
    if (error || !data) {
      el.textContent = "";
      return;
    }
    // この値は「システム状態」テーブルのtimestamptz（オフセット付き）を
    // そのまま受け取っているため、注文データ側（オフセット無しのJST文字列）用の
    // formatDateTimeではなく、ここでJST表示に変換する
    const checkedAt = new Date(data["更新日時"]);
    el.textContent = "最終更新日時: " + checkedAt.toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" });
  } catch (e) {
    el.textContent = "";
  }
}

// ログイン成功後に呼ばれる: データを取得して画面を組み立てる
async function showDashboard() {
  document.getElementById("loginScreen").hidden = true;
  document.getElementById("dashboardScreen").hidden = false;
  const notice = document.getElementById("loadingNotice");
  notice.hidden = false;
  notice.textContent = "データを読み込み中...";
  try {
    const rows = await fetchAllOrderRows();
    DATA = buildMonthlyData(rows);
    ORDER_LIST = buildOrderListByMonth(rows);

    // 売れ筋判定・利益の再計算は負荷が高いため読み込み時には行わない。
    // リサーチタブの「再取得」ボタン押下時(wireResearchFilterControls内)のみ実行する
    const stockdbRows = await fetchAllResearchRows();
    STOCKDB_LIST = buildStockdbList(stockdbRows);
    notice.hidden = true;

    // GASが「新規注文が来ていないか見に行った」時刻を表示する
    // （新規注文の有無に関わらず、チェックに行くたびに記録されている値）
    await renderLastChecked();

    // 初期表示は期間:月、状況:発送前、判定状況:全て、仕入先:すべて、表示タイプ:注文リスト
    // （filterPeriodKey等の既定値、およびHTML側のチェック済み状態と一致させている）
    renderForSelection();
    renderForSelectionR();
    dashboardLoaded = true;
  } catch (e) {
    notice.hidden = false;
    notice.textContent = "データの読み込みに失敗しました: " + e.message;
    console.error(e);
  }
}

function wireLoginForm() {
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;
    const errorEl = document.getElementById("loginError");
    const submitBtn = document.getElementById("loginSubmit");
    errorEl.hidden = true;
    submitBtn.disabled = true;
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    submitBtn.disabled = false;
    if (error) {
      errorEl.textContent = "ログインできませんでした。メールアドレスまたはパスワードをご確認ください。";
      errorEl.hidden = false;
    }
    // 成功時はonAuthStateChangeがSIGNED_INを検知してshowDashboard()を呼ぶ
  });
}

function wireLogoutButton() {
  document.getElementById("logoutButton").addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
  });
}

// イベント配線は1回だけ行う（ログイン状態・データの有無に関係ない部分）
wireFilterControls();
wireResearchFilterControls();
wireTabButtons();
wireStatusSelects();
wireTruncateClicks();
wireLoginForm();
wireLogoutButton();

// Supabaseクライアントは、他のウィンドウ/タブへ移動して戻ってくるとセッションを
// 再チェックし、SIGNED_INを再度発火させることがある。そのたびにshowDashboard()を
// 呼び直すと「さらに表示」の展開状態がリセットされてしまうため、
// 既に読み込み済みの場合は再読み込みしない
let dashboardLoaded = false;
supabaseClient.auth.onAuthStateChange((event) => {
  if (event === "SIGNED_IN" && !dashboardLoaded) showDashboard();
  if (event === "SIGNED_OUT") {
    dashboardLoaded = false;
    keepaLoaded = false;  // 売れ筋タブも次回ログイン後に読み込み直す
    showLoginScreen();
  }
});

(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    await showDashboard();
  } else {
    showLoginScreen();
  }
})();
</script>
